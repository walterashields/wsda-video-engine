<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WSDA Viewer</title>
<style>
:root {
  --bg:#0d1117; --surface:#161b22; --border:#30363d;
  --text:#e6edf3; --text-dim:#7d8590; --accent:#2f81f7;
  --accent-glow:rgba(47,129,247,0.15); --green:#3fb950;
  --green-bg:rgba(63,185,80,0.15); --red:#f85149;
  --red-bg:rgba(248,81,73,0.15); --yellow:#d29922;
  --yellow-bg:rgba(210,153,34,0.15);
  --font-mono:"SF Mono",Monaco,"Cascadia Code",Consolas,monospace;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* Title Card */
#title-card{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#0d1117 0%,#161b22 50%,#0d1117 100%);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:1000;padding:60px;text-align:center}
#title-card.active{display:flex;animation:titleFadeIn .6s ease}
@keyframes titleFadeIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
.title-badge{background:var(--red-bg);color:var(--red);border:1px solid var(--red);padding:8px 20px;border-radius:20px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:32px}
.title-headline{font-size:48px;font-weight:800;line-height:1.1;max-width:900px;margin-bottom:24px;background:linear-gradient(90deg,#fff 0%,#8b949e 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.title-sub{font-size:22px;color:var(--text-dim);max-width:700px;line-height:1.5;margin-bottom:40px}
.title-stakes{font-size:20px;color:var(--red);font-weight:600;padding:16px 32px;border:2px solid var(--red);border-radius:12px;background:var(--red-bg)}

/* Layout */
.app{display:flex;flex:1;overflow:hidden}
.sidebar{width:0;min-width:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .4s cubic-bezier(.4,0,.2,1),min-width .4s cubic-bezier(.4,0,.2,1);overflow:hidden}
.sidebar.expanded{width:280px;min-width:280px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* Header */
.header{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;font-size:14px}
.header-brand{font-weight:800;color:var(--accent);font-size:16px}
.header-db{color:var(--text-dim)}
.header-db strong{color:var(--text)}

/* Schema */
.schema-header{padding:14px 20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.schema-list{flex:1;overflow-y:auto;padding:10px}
.schema-table{margin-bottom:10px;border-radius:8px;overflow:hidden}
.schema-table-name{padding:10px 14px;font-size:14px;font-weight:600;background:rgba(255,255,255,.03);cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .2s}
.schema-table-name:hover{background:rgba(255,255,255,.06)}
.schema-table-name .arrow{font-size:10px;transition:transform .2s}
.schema-table-name.expanded .arrow{transform:rotate(90deg)}
.schema-columns{display:none;padding:6px 14px 10px}
.schema-columns.visible{display:block}
.schema-col{font-size:13px;padding:4px 0;color:var(--text-dim);font-family:var(--font-mono)}
.schema-col .col-type{color:var(--text-dim);opacity:.5;margin-left:6px}

/* ── Content Area ── */
.content-area{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

/* ── SINGLE MODE ── */
.mode-single .sql-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.mode-single .sql-toolbar{height:44px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px}
.mode-single .sql-editor-wrap{flex:1;position:relative;overflow:auto}
.mode-single .sql-editor{width:100%;min-height:100%;background:var(--bg);border:none;padding:20px 24px;font-family:var(--font-mono);font-size:17px;line-height:1.8;color:var(--text);resize:none;outline:none;white-space:pre;tab-size:2}
.mode-single .sql-editor::selection{background:rgba(47,129,247,0.5);color:#fff}

/* Query block styling in single mode */
.query-block{position:relative;padding:8px 0;border-left:3px solid transparent;transition:border-color .3s}
.query-block.active{border-left-color:var(--accent);background:rgba(47,129,247,0.05)}
.query-block.dimmed{opacity:.4}

/* ── COMPARE MODE ── */
.mode-compare .compare-grid{display:flex;flex:1;overflow:hidden}
.mode-compare .compare-col{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--border);transition:flex .3s}
.mode-compare .compare-col:last-child{border-right:none}
.mode-compare .compare-col.active{flex:1.2;background:rgba(47,129,247,0.03)}
.mode-compare .compare-col.dimmed{opacity:.5}
.mode-compare .compare-header{padding:10px 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);background:var(--surface);border-bottom:1px solid var(--border)}
.mode-compare .compare-sql{flex:0 0 auto;max-height:140px;overflow:auto;padding:12px 14px;font-family:var(--font-mono);font-size:12px;line-height:1.6;color:var(--text-dim);white-space:pre;background:var(--bg);border-bottom:1px solid var(--border)}
.mode-compare .compare-results{flex:1;overflow:auto}

/* ── FOCUS MODE ── */
.mode-focus .focus-grid{display:flex;flex:1;overflow:hidden}
.mode-focus .focus-main{flex:3;display:flex;flex-direction:column;min-width:0}
.mode-focus .focus-side{flex:1;display:flex;flex-direction:column;border-left:1px solid var(--border);overflow:auto}
.mode-focus .focus-side-item{padding:12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s}
.mode-focus .focus-side-item:hover{background:rgba(255,255,255,.03)}
.mode-focus .focus-side-item.active{background:rgba(47,129,247,0.08);border-left:3px solid var(--accent)}

/* Results */
.results-area{height:40%;min-height:180px;border-top:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface);transition:height .4s ease}
.results-area.zoomed{height:65%}
.results-header{padding:12px 20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.results-table-wrap{flex:1;overflow:auto}
.results-table{width:100%;border-collapse:collapse;font-size:16px}
.results-table th{text-align:left;padding:12px 20px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;white-space:nowrap}
.results-table td{padding:12px 20px;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:16px;white-space:nowrap}
.results-table tr:hover td{background:rgba(255,255,255,.03)}

/* Row highlights */
.results-table tr.highlighted td{background:var(--accent-glow)!important;border-left:4px solid var(--accent);animation:pulse-row 2s ease-in-out infinite}
@keyframes pulse-row{0%,100%{background:var(--accent-glow)}50%{background:rgba(47,129,247,.25)}}
.results-table tr.highlighted-red td{background:var(--red-bg)!important;border-left:4px solid var(--red);animation:pulse-row-red 2s ease-in-out infinite}
@keyframes pulse-row-red{0%,100%{background:var(--red-bg)}50%{background:rgba(248,81,73,.25)}}
.results-table tr.highlighted-green td{background:var(--green-bg)!important;border-left:4px solid var(--green);animation:pulse-row-green 2s ease-in-out infinite}
@keyframes pulse-row-green{0%,100%{background:var(--green-bg)}50%{background:rgba(63,185,80,.25)}}

/* Cell callout */
.cell-callout{position:relative;display:inline-block;background:var(--yellow-bg);padding:4px 10px;border-radius:6px;font-weight:700;color:var(--yellow)}
.cell-callout::after{content:attr(data-callout);position:absolute;top:-36px;left:50%;transform:translateX(-50%);background:var(--yellow);color:#000;padding:5px 14px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;z-index:10;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.cell-callout.visible::after{opacity:1}

/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-size:15px;gap:16px}
.empty-state .icon{width:56px;height:56px;border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}

/* Status bar */
.status-bar{height:32px;background:var(--bg);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 20px;font-size:13px;color:var(--text-dim);gap:20px}
.status-ok{color:var(--green)}.status-warn{color:var(--yellow)}.status-err{color:var(--red)}
</style>
</head>
<body>

<div id="title-card">
  <div class="title-badge" id="t-badge">SQL Lesson</div>
  <div class="title-headline" id="t-headline">Loading...</div>
  <div class="title-sub" id="t-sub"></div>
  <div class="title-stakes" id="t-stakes" style="display:none"></div>
</div>

<div class="app" id="app">
  <div class="sidebar" id="sidebar">
    <div class="schema-header"><span>Schema</span><span id="schema-count" style="font-size:11px;color:var(--text-dim)"></span></div>
    <div class="schema-list" id="schema-list"></div>
  </div>
  <div class="main">
    <div class="header">
      <span class="header-brand">WSDA</span>
      <span style="color:var(--border)">|</span>
      <span class="header-db" id="header-db">No database loaded</span>
    </div>
    <div class="content-area mode-single" id="content-area">
      <!-- Dynamic content injected here -->
    </div>
    <div class="status-bar"><span id="status-text">Ready</span></div>
  </div>
</div>

<script>
// ── State ──
let state = {
  mode: 'single',
  activeQuery: null,
  dbName: null,
  schema: [],
  queries: {},
  schemaExpanded: false,
  activeTable: null,
  callouts: [],
  highlightedRows: []
};

// ── Title Card ──
function showTitleCard(badge, headline, sub, stakes) {
  document.getElementById('t-badge').textContent = badge || 'SQL Lesson';
  document.getElementById('t-headline').textContent = headline;
  document.getElementById('t-sub').textContent = sub || '';
  const s = document.getElementById('t-stakes');
  if (stakes) { s.textContent = stakes; s.style.display = 'block'; }
  else { s.style.display = 'none'; }
  document.getElementById('title-card').classList.add('active');
}
function hideTitleCard() {
  document.getElementById('title-card').classList.remove('active');
}

// ── Schema ──
function loadDatabase(name) {
  state.dbName = name;
  document.getElementById('header-db').innerHTML = 'Database: <strong>' + name + '</strong>';
  setStatus('Database loaded: ' + name, 'ok');
}
function renderSchema(tables) {
  state.schema = tables || [];
  const list = document.getElementById('schema-list');
  list.innerHTML = '';
  document.getElementById('schema-count').textContent = tables.length + ' tables';
  tables.forEach(t => {
    const div = document.createElement('div');
    div.className = 'schema-table';
    div.innerHTML = '<div class="schema-table-name" onclick="toggleTable(this)"><span class="arrow">▶</span><span>' + t.name + '</span></div>' +
      '<div class="schema-columns">' + t.columns.map(c => '<div class="schema-col">' + c.name + '<span class="col-type">' + c.type + '</span></div>').join('') + '</div>';
    list.appendChild(div);
  });
}
function toggleTable(el) {
  el.classList.toggle('expanded');
  el.nextElementSibling.classList.toggle('visible');
}
function expandSchema() {
  state.schemaExpanded = true;
  document.getElementById('sidebar').classList.add('expanded');
}
function collapseSchema() {
  state.schemaExpanded = false;
  document.getElementById('sidebar').classList.remove('expanded');
}
function activateTable(tableName) {
  state.activeTable = tableName;
  document.querySelectorAll('.schema-table-name').forEach(el => {
    const nameSpan = el.querySelector('span:last-child');
    if (nameSpan && nameSpan.textContent.trim() === tableName) {
      el.classList.add('expanded');
      el.nextElementSibling.classList.add('visible');
    }
  });
}

// ── Results Table Builder ──
function buildResultsTable(columns, rows) {
  if (!rows || rows.length === 0) {
    return '<div class="empty-state"><div class="icon">∅</div><span>No results</span></div>';
  }
  let html = '<table class="results-table"><thead><tr>';
  columns.forEach(c => html += '<th>' + c + '</th>');
  html += '</tr></thead><tbody>';
  rows.forEach(row => {
    html += '<tr>';
    row.forEach(cell => html += '<td>' + (cell !== null ? cell : 'NULL') + '</td>');
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

// ── Layout Renderers ──
function renderSingle() {
  const area = document.getElementById('content-area');
  area.className = 'content-area mode-single';

  // Build SQL with query blocks
  let sqlHtml = '';
  const queryRefs = Object.keys(state.queries).sort();
  queryRefs.forEach(ref => {
    const q = state.queries[ref];
    const isActive = ref === state.activeQuery;
    const isDimmed = state.activeQuery && ref !== state.activeQuery;
    sqlHtml += '<div class="query-block ' + (isActive ? 'active' : '') + (isDimmed ? ' dimmed' : '') + '">' +
      '<div style="font-size:11px;color:var(--text-dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.06em">' + ref + '</div>' +
      '<pre style="margin:0;font-family:var(--font-mono);font-size:15px;line-height:1.7;color:var(--text);white-space:pre-wrap;word-break:break-word">' + escapeHtml(q.sql || '') + '</pre></div>';
  });

  const activeQ = state.activeQuery ? state.queries[state.activeQuery] : null;
  const resultsHtml = activeQ && activeQ.rows ? buildResultsTable(activeQ.columns, activeQ.rows) :
    '<div class="empty-state"><div class="icon">▷</div><span>Run a query to see results</span></div>';

  area.innerHTML =
    '<div class="sql-area">' +
      '<div class="sql-toolbar"><button>▷ Run</button><div style="flex:1"></div><span style="font-size:13px;color:var(--text-dim)">SQL Editor</span></div>' +
      '<div class="sql-editor-wrap">' + sqlHtml + '</div>' +
    '</div>' +
    '<div class="results-area">' +
      '<div class="results-header"><span>Results</span><span id="row-count">' + (activeQ && activeQ.rows ? activeQ.rows.length + ' rows' : '') + '</span></div>' +
      '<div class="results-table-wrap">' + resultsHtml + '</div>' +
    '</div>';
}

function renderCompare() {
  const area = document.getElementById('content-area');
  area.className = 'content-area mode-compare';

  const queryRefs = Object.keys(state.queries).sort();
  let colsHtml = '';
  queryRefs.forEach(ref => {
    const q = state.queries[ref];
    const isActive = ref === state.activeQuery;
    const resultsHtml = q && q.rows ? buildResultsTable(q.columns, q.rows) :
      '<div class="empty-state" style="font-size:12px;gap:8px"><div class="icon" style="width:32px;height:32px;font-size:14px">∅</div><span>No results</span></div>';

    colsHtml +=
      '<div class="compare-col ' + (isActive ? 'active' : '') + '">' +
        '<div class="compare-header">' + ref + '</div>' +
        '<div class="compare-sql">' + escapeHtml(q.sql || '') + '</div>' +
        '<div class="compare-results">' + resultsHtml + '</div>' +
      '</div>';
  });

  area.innerHTML = '<div class="compare-grid">' + colsHtml + '</div>';
}

function renderFocus() {
  const area = document.getElementById('content-area');
  area.className = 'content-area mode-focus';

  const mainRef = state.activeQuery || Object.keys(state.queries)[0];
  const mainQ = state.queries[mainRef];
  const sideRefs = Object.keys(state.queries).filter(r => r !== mainRef);

  const mainResults = mainQ && mainQ.rows ? buildResultsTable(mainQ.columns, mainQ.rows) :
    '<div class="empty-state"><div class="icon">▷</div><span>No results</span></div>';

  let sideHtml = '';
  sideRefs.forEach(ref => {
    const q = state.queries[ref];
    sideHtml +=
      '<div class="focus-side-item">' +
        '<div style="font-size:11px;color:var(--text-dim);margin-bottom:4px">' + ref + '</div>' +
        '<pre style="margin:0;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);white-space:pre-wrap">' + escapeHtml((q.sql || '').substring(0, 200)) + '</pre>' +
      '</div>';
  });

  area.innerHTML =
    '<div class="focus-grid">' +
      '<div class="focus-main">' +
        '<div class="sql-area">' +
          '<div class="sql-toolbar"><button>▷ Run</button><div style="flex:1"></div><span style="font-size:13px;color:var(--text-dim)">' + mainRef + '</span></div>' +
          '<div class="sql-editor-wrap"><pre style="padding:20px 24px;font-family:var(--font-mono);font-size:15px;line-height:1.7;color:var(--text);white-space:pre-wrap">' + escapeHtml(mainQ.sql || '') + '</pre></div>' +
        '</div>' +
        '<div class="results-area">' +
          '<div class="results-header"><span>Results</span><span id="row-count">' + (mainQ.rows ? mainQ.rows.length + ' rows' : '') + '</span></div>' +
          '<div class="results-table-wrap">' + mainResults + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="focus-side">' + sideHtml + '</div>' +
    '</div>';
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ── Main State Update ──
function setScreenState(newState) {
  // Merge new state
  Object.assign(state, newState);

  // Update queries if provided
  if (newState.queries) {
    Object.assign(state.queries, newState.queries);
  }

  // Render based on mode
  if (state.mode === 'compare') {
    renderCompare();
  } else if (state.mode === 'focus') {
    renderFocus();
  } else {
    renderSingle();
  }

  // Apply callouts
  if (state.callouts) {
    state.callouts.forEach(c => annotateCell(null, c.row, c.col, c.text));
  }

  // Apply row highlights
  if (state.highlightedRows) {
    state.highlightedRows.forEach(h => highlightRow(null, h.index, h.color));
  }
}

// ── Legacy helpers (for partial updates) ──
function setSQL(content) {
  // Parse queries from SQL file
  const queries = {};
  const pattern = /-- \[(query_\w+)\](.*?)(?=-- \[query_\w+\]|$)/gs;
  let m;
  while ((m = pattern.exec(content)) !== null) {
    const ref = m[1].trim();
    const body = m[2].trim();
    const sqlMatch = body.match(/\b(SELECT|INSERT|UPDATE|DELETE|WITH|CREATE|DROP)\b/si);
    if (sqlMatch) {
      let sql = body.substring(sqlMatch.index).trim();
      sql = sql.replace(/\s*--[^\n]*/g, '').replace(/;\s*$/, '').trim();
      if (sql) queries[ref] = { sql: sql, columns: [], rows: [] };
    }
  }
  state.queries = queries;
  renderSingle();
}

function showResults(columns, rows, queryName) {
  if (queryName && state.queries[queryName]) {
    state.queries[queryName].columns = columns;
    state.queries[queryName].rows = rows;
  }
  // Re-render current mode
  if (state.mode === 'compare') renderCompare();
  else if (state.mode === 'focus') renderFocus();
  else renderSingle();
}

function highlightRow(selector, rowIndex, color) {
  const table = document.querySelector(selector || '.results-table');
  if (!table) return;
  const rows = table.querySelectorAll('tbody tr');
  rows.forEach(r => r.classList.remove('highlighted', 'highlighted-red', 'highlighted-green'));
  if (rows[rowIndex]) {
    rows[rowIndex].classList.add(color === 'red' ? 'highlighted-red' : color === 'green' ? 'highlighted-green' : 'highlighted');
  }
}
function clearHighlights(selector) {
  const table = document.querySelector(selector || '.results-table');
  if (!table) return;
  table.querySelectorAll('tr').forEach(r => r.classList.remove('highlighted', 'highlighted-red', 'highlighted-green'));
}
function annotateCell(selector, rowIndex, colIndex, text) {
  const table = document.querySelector(selector || '.results-table');
  if (!table) return;
  const rows = table.querySelectorAll('tbody tr');
  if (!rows[rowIndex]) return;
  const cells = rows[rowIndex].querySelectorAll('td');
  if (!cells[colIndex]) return;
  cells[colIndex].classList.add('cell-callout');
  cells[colIndex].setAttribute('data-callout', text);
  setTimeout(() => cells[colIndex].classList.add('visible'), 100);
}
function clearAnnotations(selector) {
  const table = document.querySelector(selector || '.results-table');
  if (!table) return;
  table.querySelectorAll('.cell-callout').forEach(c => {
    c.classList.remove('cell-callout', 'visible');
    c.removeAttribute('data-callout');
  });
}
function zoomResults() {
  document.querySelectorAll('.results-area').forEach(el => el.classList.add('zoomed'));
}
function resetZoom() {
  document.querySelectorAll('.results-area').forEach(el => el.classList.remove('zoomed'));
}
function fadeOut() {
  document.body.style.transition = 'opacity 1.5s ease';
  document.body.style.opacity = '0';
}
function setStatus(text, type) {
  const el = document.getElementById('status-text');
  el.textContent = text;
  el.className = type === 'ok' ? 'status-ok' : type === 'warn' ? 'status-warn' : type === 'err' ? 'status-err' : '';
}

console.log('WSDA Viewer v4 (state-driven) ready');
</script>
</body>
</html>

events:
- id: e01
  type: open_database
  target: sql_viewer
  asset: assets/sql_and_ai.db
  transition: new_concept
  narration: 'Hey, welcome in. If you''re a data analyst, a junior data engineer, or anyone in B-I who''s
    started using A-I tools to write S-Q-L, this one''s for you. Here''s the deal: by the end of the next
    five minutes, you''ll know how to prompt an A-I tool to generate a S-Q-L query, you''ll know exactly
    where A-I-generated S-Q-L commonly fails, and you''ll have a quick validation technique you can run
    in under sixty seconds to confirm the answer is actually correct. Because here''s the thing nobody
    warns you about: A-I-generated S-Q-L almost always looks right. It''s syntactically clean, it runs
    without errors, and the results look totally plausible. But "plausible" and "correct" are not the
    same thing, and the gap between them is where careers get embarrassing. So let''s fix that.

    '
- id: e01_pause
  type: pause
  duration: 62.2
  transition: continuation
- id: e02
  type: show_schema
  target: sql_viewer
  transition: new_concept
  narration: 'Alright, let''s look at what we''re working with. We''ve got two tables in this database.
    First up is the customers table, with three columns: customer_id, customer_name, and region. Simple
    stuff, just a list of who our customers are and where they''re located. Then we''ve got the orders
    table, with four columns: order_id, customer_id, order_date, and total_amount. So each row is one
    order, tied back to a customer through customer_id. That''s the entire schema. Two tables, seven columns
    total. And this is exactly what you''d paste into an A-I tool before asking it to write anything.
    Don''t skip this step. The single biggest prompt mistake people make is asking for S-Q-L without giving
    the A-I the table structure. Without it, the A-I is literally guessing column names. With it, the
    A-I knows the relationships, the data types, everything. So step one of our workflow: always prompt
    with schema context.

    '
- id: e02_pause
  type: pause
  duration: 69.2
  transition: continuation
- id: e03
  type: open_file
  target: sql_viewer
  asset: assets/lesson_1_queries.sql
  transition: new_concept
- id: e03_pause
  type: pause
  duration: 2.0
  transition: continuation
- id: e04
  type: highlight_section
  target: sql_viewer
  section: ai_generated_top5_query
  transition: new_concept
  clears: []
  narration: 'Okay, here''s the query our A-I generated after we gave it the schema and asked: "Show me
    the top five customers by total revenue." Let''s read through it before we run anything. It''s selecting
    customer_name and region from the customers table, then counting orders as total_orders and summing
    total_amount as total_revenue from the orders table. It joins customers to orders on customer_id,
    groups by customer_name and region, orders by total_revenue descending, and limits to five. Honestly,
    this looks solid. The join logic is correct, it''s grouping properly, it''s sorting the right direction.
    If you just glanced at this, you''d think, "great, ship it." But we''re not shipping anything until
    we verify. That''s step two. Let''s run it and see what comes back.

    '
- id: e04_pause
  type: pause
  duration: 58.5
  transition: continuation
- id: e05
  type: run_query
  target: sql_viewer
  query_ref: ai_generated_top5_query
- id: e05_pause
  type: pause
  duration: 3.0
  transition: continuation
- id: e06
  type: show_result
  target: sql_viewer
  transition: continuation
  narration: 'Alright, results are in, let''s dig through this. Five rows, four columns: customer_name,
    region, total_orders, and total_revenue. Row one, sitting at the top of the leaderboard: Greenfield
    Manufacturing, out of the Northeast, with six orders and a total revenue of ninety-four thousand eight
    hundred seventy point zero zero. Greenfield is not messing around. Row two: Pinnacle Health Systems,
    also Northeast, four orders, eighty-nine thousand one hundred twenty-four point zero zero. That''s
    almost six thousand less than Greenfield, so the top spot isn''t even close. Row three: Apex Logistics,
    Southeast region, four orders, seventy-eight thousand four hundred eleven point two five. Notice that
    decimal, point two five, so we''ve got some partial dollar amounts in the data. Row four: Vanguard
    Retail Group, Northeast again, four orders, seventy-two thousand three hundred eighty point zero zero.
    And row five: Bridgewater Solutions, Midwest, three orders, sixty-seven thousand two hundred ninety-five
    point zero zero. So the Northeast is absolutely dominating this top five, three out of five customers.
    Now, these results look perfectly reasonable. But "looks reasonable" is exactly the trap. Step two
    says we pick one row and independently verify it. Let''s cross-examine the A-I''s work.

    '
- id: e06_pause
  type: pause
  duration: 87.4
  transition: continuation
- id: e07
  type: highlight_section
  target: sql_viewer
  section: micro_query_spot_check
  transition: new_concept
  clears:
  - ai_generated_top5_query
  narration: 'Here''s our micro-query, and I want you to notice how dead simple this is. We''re writing
    the smallest possible S-Q-L to independently verify just one value from the A-I''s results. We''re
    summing total_amount from the orders table, joining to customers on customer_id, and filtering where
    customer_name equals Greenfield Manufacturing. That''s it. No grouping by five customers, no ordering,
    no limit. Just one question: what''s the actual total revenue for Greenfield Manufacturing according
    to the raw data? If this number matches what the A-I query returned, our confidence goes way up. If
    it doesn''t match, we just caught a bug before it hit a dashboard or a stakeholder''s inbox. This
    is the micro-query technique, and it takes about fifteen seconds to write. Let''s run it.

    '
- id: e07_pause
  type: pause
  duration: 59.3
  transition: continuation
- id: e08
  type: run_query
  target: sql_viewer
  query_ref: micro_query_spot_check
- id: e08_pause
  type: pause
  duration: 3.0
  transition: continuation
- id: e09
  type: show_result
  target: sql_viewer
  transition: continuation
  narration: 'One column, one row: verified_total, ninety-four thousand eight hundred seventy point zero
    zero. And what did the A-I query say for Greenfield Manufacturing? Ninety-four thousand eight hundred
    seventy point zero zero. The numbers match exactly. The alibi checks out. Now look, does this guarantee
    the entire query is perfect? No. But it means the join logic is working, the aggregation is correct,
    and for at least this one customer, the A-I nailed it. That''s a massive confidence boost from a query
    that took fifteen seconds to write. And if the numbers hadn''t matched? You''d know immediately that
    something''s off in the join, the filter, or the grouping, and you''d debug it right here instead
    of finding out three weeks later when your VP asks why the revenue numbers don''t add up.

    '
- id: e09_pause
  type: pause
  duration: 62.2
  transition: continuation
- id: e10
  type: highlight_section
  target: sql_viewer
  section: ai_generated_top5_query
  transition: new_concept
  clears:
  - micro_query_spot_check
  narration: 'Now let''s talk about step three, the one most people skip, and honestly it''s the most
    valuable. After your micro-query confirms the numbers, you take this query and paste it back into
    your A-I tool with one simple follow-up: "Explain this query step by step, including any assumptions
    you made." When you do that, the A-I will walk through every clause and, crucially, it''ll call out
    its own assumptions. For example, it might tell you it assumed order_date means the date the order
    was placed, not the date it was shipped. In our case, that assumption happens to be fine. But in a
    real-world scenario with shipped_date and placed_date columns? That assumption could silently wreck
    your numbers. The point is, you won''t know what the A-I assumed unless you ask. And now you know
    to ask.

    '
- id: e10_pause
  type: pause
  duration: 64.3
  transition: continuation
- id: e_close
  type: zoom_result
  target: sql_viewer
  transition: emphasis
  narration: 'Let''s recap the whole workflow. Step one: prompt with schema context. Paste your CREATE
    TABLE statements so the A-I knows your column names, data types, and relationships. Step two: run
    the query and spot-check with a micro-query. Pick one row from the result, write the simplest possible
    S-Q-L to verify that single value independently. If Greenfield Manufacturing shows ninety-four thousand
    eight hundred seventy point zero zero in the A-I result, your micro-query better return ninety-four
    thousand eight hundred seventy point zero zero too. Step three: ask the A-I to explain its own query
    and surface its hidden assumptions. These three steps take under a minute, and they prevent hours
    of debugging wrong data. You can download the sample database and the prompt template in the description.
    Now go build something you can actually trust.

    '

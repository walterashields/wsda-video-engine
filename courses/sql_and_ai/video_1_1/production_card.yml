events:
- id: e01
  type: open_database
  target: sql_viewer
  asset: assets/sql_and_ai.db
  transition: new_concept
  narration: 'Hey, welcome in. If you''re a data analyst, a junior data engineer, or anyone in B-I who''s
    started using A-I tools to write S-Q-L, this lesson''s for you. By the end of these five minutes,
    you''ll be able to prompt an A-I tool to generate a S-Q-L query, spot where A-I-generated S-Q-L commonly
    fails, and apply a quick validation technique to confirm your results are actually correct. Here''s
    the thing nobody warns you about: A-I-generated S-Q-L almost always looks right. The syntax is clean,
    the JOINs make sense, and the results come back without a single error. But "no errors" and "correct"
    aren''t the same thing. Let''s dig into why, and more importantly, let''s fix it.

    '
- id: e01_pause
  type: pause
  duration: 56.0
  transition: continuation
- id: e02
  type: show_schema
  target: sql_viewer
  transition: new_concept
  narration: 'Alright, here''s the database we''re working with today. Two tables, nice and simple. First,
    we''ve got a customers table with four columns: customer_id, customer_name, region, and signup_date.
    Then we''ve got an orders table with five columns: order_id, customer_id, order_date, total_amount,
    and status. Notice that status column on orders. That''s going to be the star of today''s cautionary
    tale. Because if you ask an A-I to find your top customers by revenue and you don''t mention that
    status column, guess what? The A-I doesn''t know that some of those orders might be cancelled. It''ll
    happily add up every single order, cancelled or not, and hand you a number that looks perfectly reasonable
    but is quietly, dangerously wrong.

    '
- id: e02_pause
  type: pause
  duration: 61.0
  transition: continuation
- id: e03
  type: open_file
  target: sql_viewer
  asset: assets/lesson_1_queries.sql
  transition: new_concept
- id: e03_pause
  type: pause
  duration: 2.0
  transition: continuation
- id: e04
  type: highlight_section
  target: sql_viewer
  section: ai_generated_top5_query
  transition: new_concept
  clears: []
  narration: 'Okay, step one of our three-step workflow: prompt with schema context. Instead of just asking
    "find my top five customers by revenue," we pasted our CREATE TABLE statements for customers and orders
    right into the chat. That way the A-I knows about customer_name, region, total_amount, and crucially,
    that status column. What came back is this query right here. It''s joining customers to orders on
    customer_id, filtering the status column to exclude cancelled orders, grouping by customer_name and
    region, and ordering by total revenue descending with a limit of five. This is miles better than what
    you''d get from a lazy prompt. The A-I actually built in the WHERE clause for status because we gave
    it the schema to work with. But here''s where most people stop. They see a clean query, they see results,
    and they move on. We''re not most people. Let''s run it and see what we get.

    '
- id: e04_pause
  type: pause
  duration: 77.6
  transition: continuation
- id: e05
  type: run_query
  target: sql_viewer
  query_ref: ai_generated_top5_query
- id: e05_pause
  type: pause
  duration: 3.0
  transition: continuation
- id: e06
  type: show_result
  target: sql_viewer
  transition: continuation
  narration: 'Alright, results are in. Let''s read through every single row because the details matter.
    Row one: Greenfield Manufacturing, out of the Northeast region, five total orders, and a total revenue
    of forty-eight thousand seven hundred thirty-five point five zero. That''s our top spender and it''s
    not even close. Row two: Apex Digital Solutions from the West, four orders, forty-one thousand nine
    hundred eighty point zero zero. Solid, but that''s almost seven thousand dollars behind Greenfield.
    Row three: Lakewood Medical Group, Southeast, also four orders, thirty-seven thousand six hundred
    fifteen point seven five. Row four: Summit Financial Partners, Midwest, three orders, thirty-three
    thousand one hundred twenty-five point zero zero. And row five: Coastal Freight Logistics, West region,
    four orders, twenty-nine thousand eight hundred seventy point two five. So we''ve got our top five.
    The query ran clean. The numbers look believable. But do we trust them? Not yet. That brings us to
    step two.

    '
- id: e06_pause
  type: pause
  duration: 85.6
  transition: continuation
- id: e07
  type: highlight_section
  target: sql_viewer
  section: micro_query_spot_check
  transition: new_concept
  clears:
  - ai_generated_top5_query
  narration: 'Step two: run a micro-query to spot-check. Here''s the idea. We''re not going to verify
    all five rows. We''re going to pick one, just one, and write the simplest possible query to independently
    check that single value. We''re going after Greenfield Manufacturing because it''s our number one
    result. If the A-I got the top row wrong, everything else is suspect. This micro-query is dead simple.
    It''s just a SUM of total_amount from orders, joined to customers, filtered to only Greenfield Manufacturing
    and only non-cancelled orders. No fancy grouping, no ordering, no limit. Just one number. Think of
    it like cross-examining a witness. The A-I gave us its answer, and now we''re checking the alibi with
    a completely independent query. Let''s run it.

    '
- id: e07_pause
  type: pause
  duration: 63.2
  transition: continuation
- id: e08
  type: run_query
  target: sql_viewer
  query_ref: micro_query_spot_check
- id: e08_pause
  type: pause
  duration: 3.0
  transition: continuation
- id: e09
  type: show_result
  target: sql_viewer
  transition: continuation
  narration: 'One column, one row, one number: verified_total comes back as forty-eight thousand seven
    hundred thirty-five point five zero. And what did our A-I query say for Greenfield Manufacturing''s
    total revenue? Forty-eight thousand seven hundred thirty-five point five zero. The alibi checks out.
    Those numbers match exactly, and that feels good. That''s not a coincidence, that''s confirmation.
    This micro-query took about fifteen seconds to write and maybe two seconds to run, and now we''ve
    got real confidence that the A-I''s logic is sound, at least for this row. If those numbers hadn''t
    matched, we''d know the A-I made a silent mistake somewhere, maybe in the JOIN, maybe in the WHERE
    clause, maybe in the grouping. And we''d have caught it before it ended up in a dashboard or a stakeholder
    presentation. That''s the whole point.

    '
- id: e09_pause
  type: pause
  duration: 67.5
  transition: continuation
- id: e10
  type: highlight_section
  target: sql_viewer
  section: ai_generated_top5_query
  transition: new_concept
  clears:
  - micro_query_spot_check
  narration: 'Step three, and this is the one most people skip: go back to your A-I tool and ask it to
    explain the query step by step, including any assumptions it made. When you do this, the A-I will
    surface things you didn''t think to ask about. For example, it might tell you it assumed order_date
    means the date the order was placed, not the date it was shipped. In our case that assumption''s correct,
    but imagine a scenario where your company defines revenue recognition based on ship date. That one
    hidden assumption could throw off your entire analysis. You won''t catch that by staring at the S-Q-L.
    You catch it by asking the A-I to show its work. It takes ten seconds, and it''s the most underrated
    step in the whole workflow.

    '
- id: e10_pause
  type: pause
  duration: 62.6
  transition: continuation
- id: e_close
  type: zoom_result
  target: sql_viewer
  transition: emphasis
  narration: 'Let''s wrap it up. Three steps, under a minute each. Step one: prompt with schema context.
    Paste your CREATE TABLE statements so the A-I knows your columns, your data types, and especially
    tricky columns like status. Step two: run the query and spot-check with a micro-query. Pick one row,
    write the simplest possible S-Q-L to verify that single value. We checked Greenfield Manufacturing''s
    total revenue of forty-eight thousand seven hundred thirty-five point five zero, and it matched perfectly.
    Step three: ask the A-I to explain its own query and call out its assumptions. That''s where hidden
    business logic errors get caught. These three steps don''t slow you down. They save you from hours
    of debugging bad data downstream. Grab the sample database and the prompt template from the description,
    and try this workflow on your own data. You''ll never blindly trust A-I-generated S-Q-L again.

    '

- id: e07
  type: show_message
  target: chat_demo
  text: OK I'm ready. Walk me through it step by step. How do I actually create the Pivot Table?
  region: prompt-2
  transition: continuation
- id: e07_pause
  type: pause
  duration: 0.5
  transition: continuation
- id: e08
  type: show_response
  target: chat_demo
  text: '**Step 1 — Select & Insert**

    Click any cell inside your data. Go to Insert > Pivot Table. Click OK.


    **Step 2 — Drag Store into Rows**

    In the field list on the right, drag "Store" into the Rows area.


    **Step 3 — Drag Amount into Values**

    Drag "Amount" into the Values area.


    ✅ **Done.** You now have total sales per store. 10,000 rows summarized instantly.'
  region: response-2
  transition: continuation
- id: e08_pause
  type: pause
  duration: 1.0
  transition: continuation
- id: e08b
  type: highlight_region
  target: chat_demo
  region: response-2
  callout: Three steps — that's genuinely it
  transition: continuation
  narration: 'Three steps. I''m not exaggerating. Step one, click any cell in your data, go to Insert,
    click Pivot Table, click OK. Step two, you''ll see a field list on the right side of your screen.
    Drag Store into the Rows area. Step three, drag Amount into the Values area. And just like that, Excel
    crunches all ten thousand rows and gives you a clean little summary showing total sales per store.
    You didn''t write a formula. You didn''t filter anything. You dragged two words into two boxes. Your
    boss thinks you''re a genius.

    '

- id: e04
  type: show_message
  target: chat_demo
  text: I have a spreadsheet with 10,000 rows of coffee shop sales — columns for Date, Store, Product,
    and Amount. My boss wants total sales by store. I don't know any formulas. What do I do?
  region: prompt-1
  transition: continuation
- id: e04_pause
  type: pause
  duration: 0.5
  transition: continuation
- id: e05
  type: show_response
  target: chat_demo
  text: 'Don''t panic — you need a Pivot Table. Here''s the good news: no formulas required.


    **Your data has 4 columns:**

    • Date

    • Store

    • Product

    • Amount


    **What a Pivot Table does:**

    It takes thousands of rows and instantly groups and totals them for you. You just tell it WHAT to
    group by and WHAT to add up.


    You won''t type a single formula. You''ll just drag and drop field names into boxes. Excel does all
    the math.'
  region: response-1
  transition: continuation
- id: e05_pause
  type: pause
  duration: 1.0
  transition: continuation
- id: e05b
  type: highlight_region
  target: chat_demo
  region: response-1
  callout: No formulas — just drag and drop
  transition: continuation
  narration: 'Look at what''s on screen. Your data has four columns, Date, Store, Product, and Amount.
    That''s ten thousand rows of coffee shop sales, and it looks terrifying. But a Pivot Table doesn''t
    care how big your data is. It just needs you to tell it two things: what to group by, and what to
    add up. No formulas. No filters. No tears. You''re literally going to drag field names into boxes.
    That''s the secret nobody told you.

    '

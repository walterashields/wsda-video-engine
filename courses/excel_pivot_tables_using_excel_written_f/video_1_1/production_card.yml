  callout: Your Pivot Table crash course starts here
  transition: new_concept
  narration: 'Alright, here''s the scenario. You''re early in your career, maybe still in school, and
    your boss just dropped a spreadsheet on you with ten thousand rows of data. Ten. Thousand. Rows. And
    they want a summary by end of day. You don''t know formulas. You don''t know VLOOKUP. You''re about
    to spiral. Don''t. By the end of this lesson, you''ll know that a Pivot Table is created by selecting
    your data, clicking Insert, then Pivot Table, and dragging fields into Rows and Values. That''s it.
    That''s the whole trick. Let''s go.

    '

  clears:
  - live_totals_by_region
  narration: 'Now here''s where things get interesting. This next query pulls the reported totals from
    the dashboard snapshot table and lines them up against our live totals from the orders table. Same
    regions, side by side, with a gap column showing the difference. This is the moment of truth. Let''s
    run it and see if the numbers agree.

    '
- id: e07_pause
  type: pause
  duration: 31.6
  transition: continuation
- id: e08
  type: run_query
  target: sql_viewer
  query_ref: dashboard_vs_live_comparison
- id: e08_pause
  type: pause
  duration: 3.0
  transition: continuation
- id: e09
  type: show_result
  target: sql_viewer
  transition: continuation
  narration: 'Ooof. Every single region is off. Northeast, the dashboard says twelve thousand three hundred
    sixty-five point eight zero, but our live query says fifteen thousand two hundred forty-one point
    two zero. That''s a gap of two thousand eight hundred seventy-five point four zero. The West is even
    worse, a gap of three thousand three hundred ten point zero zero. And the South''s off by one thousand
    nine hundred sixty point two five. Not one region matches. This is exactly the kind of moment where
    you get that Slack message from your manager saying, hey, your numbers don''t match the dashboard,
    what''s going on?

    '
- id: e09_pause
  type: pause
  duration: 50.6
  transition: continuation

- id: e15
  type: show_result
  target: sql_viewer
  transition: continuation
  narration: 'There it is. Northeast, twelve thousand three hundred sixty-five point eight zero. South,
    nine thousand fifty-one point two five. West, nine thousand five hundred ninety-five point seven five.
    Every single one matches the dashboard snapshot. The alibi checks out. Our S-Q-L wasn''t wrong, it
    was just including data the dashboard hadn''t seen yet.

    '
- id: e15_pause
  type: pause
  duration: 29.9
  transition: continuation
- id: e16
  type: zoom_result
  target: sql_viewer
  transition: emphasis
  narration: 'So here''s your takeaway. A syntactically perfect GROUP BY query can still return totals
    that don''t match the dashboard, and the problem is almost never the S-Q-L engine itself. It''s a
    mismatch between what your query includes and what the dashboard includes. In this case, it was timing,
    orders that arrived after the snapshot. But across this course, we''re going to dig into four more
    root causes, duplicate rows inflating your totals, filter mismatches where your query and the dashboard
    aren''t looking at the same slice of data, NULL handling where missing values silently skew your aggregations,
    and date or timezone logic where the same order lands on different days depending on who''s asking.
    Five causes, five lessons, and by the end you''ll have a reusable checklist you can pull out any time
    a number doesn''t match. Let''s get started with the most common culprit, duplicate rows.

    '

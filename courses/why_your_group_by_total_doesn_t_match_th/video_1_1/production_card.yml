schema_version: '3.0'
lesson_id: video_1_1
title: Three reasons your GROUP BY total never matches the dashboard
course: Why your GROUP BY total doesn't match the dashboard
assets:
  database: assets/why_your_group_by_total_doesn_t_match_th.db
  sql_file: assets/lesson_1_queries.sql
events:
- id: e01
  type: open_database
  target: sql_viewer
  asset: assets/why_your_group_by_total_doesn_t_match_th.db
  transition: new_concept
  narration: 'Hey, if you''re a data analyst who writes S-Q-L every day and you''ve ever had that stomach-dropping
    moment where your GROUP BY total doesn''t match the dashboard, this lesson''s for you. By the end,
    you''ll be able to spot and fix the three sneakiest reasons your numbers disagree: fan-out joins inflating
    your rows, hidden dashboard filters quietly excluding data, and metric definitions that drifted apart
    when nobody was looking. Let''s get into it.

    '
- id: e01_pause
  type: pause
  duration: 42.1
  transition: continuation
- id: e02
  type: show_schema
  target: sql_viewer
  transition: new_concept
  narration: 'Here''s what we''re working with. Two tables. First, we''ve got the orders table, with columns
    for order ID, region, order date, and order total. Then there''s the order items table, which has
    item ID, order ID, product name, line item price, quantity, and discount. Classic one-to-many setup,
    right? One order, multiple line items. And that relationship is exactly where our first trap is hiding.

    '
- id: e02_pause
  type: pause
  duration: 35.5
  transition: continuation
- id: e03
  type: open_file
  target: sql_viewer
  asset: assets/lesson_1_queries.sql
  transition: new_concept
- id: e03_pause
  type: pause
  duration: 1.4
  transition: continuation
- id: e04
  type: highlight_section
  target: sql_viewer
  section: fanout_wrong
  transition: new_concept
  clears: []
  narration: 'Alright, here''s the query that gets everyone in trouble. We''re joining orders to order
    items and then doing a GROUP BY on region, summing order total, and counting rows. Seems totally reasonable,
    right? But here''s the problem. When you join orders to order items, every order row gets duplicated
    once per line item. So if an order has three line items, that order total gets summed three times.
    Let''s run it and see the damage.

    '
- id: e04_pause
  type: pause
  duration: 40.4
  transition: continuation
- id: e05
  type: run_query
  target: sql_viewer
  query_ref: fanout_wrong
- id: e05_pause
  type: pause
  duration: 2.2
  transition: continuation
- id: e06
  type: show_result
  target: sql_viewer
  transition: continuation
  narration: 'Look at this. The West region shows eight rows and an inflated revenue of two thousand two
    hundred forty-one point seven three. East has six rows coming in at one thousand four hundred ninety-five
    point four zero. And Central shows four rows at five hundred seventy-two point four zero. Those row
    counts are way too high, and those revenue numbers are bloated. That''s our fan-out in action, every
    order total getting counted once per line item.

    '
- id: e06_pause
  type: pause
  duration: 39.8
  transition: continuation
- id: e07
  type: highlight_section
  target: sql_viewer
  section: fanout_fixed
  transition: new_concept
  clears:
  - fanout_wrong
  narration: 'Now here''s the fix. Instead of joining and summing blindly, we pre-aggregate the orders
    in a subquery first, then join to order items separately. This way each order total only gets counted
    once, and we pick up the line item count on its own. Let''s run this corrected version.

    '
- id: e07_pause
  type: pause
  duration: 26.6
  transition: continuation
- id: e08
  type: run_query
  target: sql_viewer
  query_ref: fanout_fixed
- id: e08_pause
  type: pause
  duration: 2.2
  transition: continuation
- id: e09
  type: show_result
  target: sql_viewer
  transition: continuation
  narration: 'Now we''re talking. The West region has three orders, true revenue of seven hundred seventy-seven
    point two four, and eight line items. East shows three orders, seven hundred forty-seven point seven
    zero in true revenue, six line items. Central has two orders at two hundred fifty-five point six zero
    with four line items. See how the order counts dropped way down compared to those inflated row counts
    from before? West went from eight rows to three actual orders. That''s the fan-out completely gone.
    Your row counts are your best friend when debugging this stuff.

    '
- id: e09_pause
  type: pause
  duration: 48.1
  transition: continuation
- id: e10
  type: compare_results
  target: sql_viewer
  transition: emphasis
  narration: 'Let''s just appreciate the difference side by side for a second. West''s inflated revenue
    was two thousand two hundred forty-one point seven three. The real number? Seven hundred seventy-seven
    point two four. That''s nearly three times too high. If you''d put that inflated number in a report,
    you''d have some very confused stakeholders. Fan-out joins are sneaky because the query runs fine,
    no errors, no warnings, just quietly wrong numbers. Always check your row counts before and after
    a join.

    '
- id: e10_pause
  type: pause
  duration: 42.7
  transition: continuation
- id: e11
  type: highlight_section
  target: sql_viewer
  section: metric_drift_order_total
  transition: new_concept
  clears:
  - fanout_fixed
  narration: 'Okay, fan-out''s fixed, filters are matched, but there''s one more gremlin. Culprit three
    is metric definition drift, and it''s the most annoying one because everyone thinks they''re calculating
    "revenue" but nobody agreed on what revenue actually means. This first query sums the order total
    column from the orders table. That''s one definition of revenue. Let''s see what it gives us.

    '
- id: e11_pause
  type: pause
  duration: 33.6
  transition: continuation
- id: e12
  type: run_query
  target: sql_viewer
  query_ref: metric_drift_order_total
- id: e12_pause
  type: pause
  duration: 2.2
  transition: continuation
- id: e13
  type: show_result
  target: sql_viewer
  transition: continuation
  narration: 'Using order total, we get Central at two hundred fifty-five point six zero, East at seven
    hundred forty-seven point seven zero, and West at seven hundred seventy-seven point two four. These
    are the gross order totals. Now let''s see what happens when we calculate revenue the way a dashboard
    might.

    '
- id: e13_pause
  type: pause
  duration: 27.0
  transition: continuation
- id: e14
  type: highlight_section
  target: sql_viewer
  section: metric_drift_line_math
  transition: new_concept
  clears:
  - metric_drift_order_total
  narration: 'This second query calculates revenue from the order items table instead, using line item
    price times quantity minus the discount. That''s net revenue after discounts, a totally different
    animal. If your dashboard''s using this formula but you''re summing order total, you''ll never match.
    Let''s run it and see the gap.

    '
- id: e14_pause
  type: pause
  duration: 28.6
  transition: continuation
- id: e15
  type: run_query
  target: sql_viewer
  query_ref: metric_drift_line_math
- id: e15_pause
  type: pause
  duration: 2.2
  transition: continuation
- id: e16
  type: show_result
  target: sql_viewer
  transition: continuation
  narration: 'There it is. Revenue from line items gives us Central at two hundred three point three zero,
    East at four hundred eighty-two point zero four, and West at five hundred twenty-three point eight
    six. Compare that to the order total numbers we just saw. East dropped from seven hundred forty-seven
    point seven zero down to four hundred eighty-two point zero four. That''s a big gap, and it''s entirely
    because discounts are being subtracted in one formula but not the other. Neither number is wrong,
    they''re just answering different questions. The fix is simple: find out which formula your dashboard
    uses and match it exactly in your S-Q-L.

    '
- id: e16_pause
  type: pause
  duration: 50.4
  transition: continuation
- id: e_close
  type: zoom_result
  target: sql_viewer
  transition: emphasis
  narration: 'Alright, here''s your thirty-second debug checklist for every time your numbers don''t match
    the dashboard. Step one, check for fan-out. Compare row counts before and after your joins. If they
    jump, you''ve got duplicates inflating your totals. Step two, match every dashboard filter in your
    WHERE clause, date ranges, status exclusions, test accounts, all of it. Step three, confirm the metric
    formula. Is the dashboard using order total or line item price times quantity minus discount? They''re
    not the same thing. Do these three checks in order, every time, and you''ll stop chasing phantom mismatches.
    Grab the exercise files linked in the description and try it yourself.

    '
- id: e_close_pause
  type: pause
  duration: 56.5
  transition: continuation
- id: e_end
  type: fade_out
  target: all
  transition: emphasis

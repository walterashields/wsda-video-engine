  asset: assets/why_your_group_by_total_doesn_t_match_th.db
  transition: new_concept
  narration: 'Hey, welcome. This lesson''s for you if you''ve just started writing S-Q-L, or maybe you''ve
    recently landed your first data analyst gig and you''re staring at a query result that doesn''t match
    what the dashboard says. By the end of this lesson, you''ll be able to describe exactly how a perfectly
    correct GROUP BY query can still give you the wrong total, and you''ll know the five root-cause categories
    we''re going to investigate together across this course. Let''s jump in.

    '
- id: e01_pause
  type: pause
  duration: 41.1
  transition: continuation
- id: e02
  type: show_schema
  target: sql_viewer
  transition: new_concept
  narration: 'Alright, here''s our database. We''ve got two tables. First, the orders table, with columns
    order ID, order date, customer name, region, and order total. That''s the raw transactional data,
    every sale that went through the system. Second, we''ve got a dashboard snapshot table, with columns
    region, reported total, and snapshot date. Think of this as a frozen copy of what the dashboard showed
    at a particular moment in time. Two tables, supposedly telling the same story. Let''s see if they
    agree.

    '
- id: e02_pause
  type: pause
  duration: 41.5
  transition: continuation
- id: e03

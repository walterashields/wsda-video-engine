  narration: 'So let''s play detective. This next query pulls out the specific orders that are causing
    the gap, the ones that exist in the orders table but weren''t included when the dashboard snapshot
    was taken. Let''s see who the culprits are.

    '
- id: e10_pause
  type: pause
  duration: 24.6
  transition: continuation
- id: e11
  type: run_query
  target: sql_viewer

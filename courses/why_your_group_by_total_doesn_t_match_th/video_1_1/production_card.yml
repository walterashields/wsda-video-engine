  target: sql_viewer
  section: live_totals_by_region
  transition: new_concept
  clears: []
  narration: 'Here''s our first query. It''s about as simple as S-Q-L gets. We''re summing order total
    from the orders table, grouped by region. No filters, no joins, no fancy window functions. Just, hey
    database, tell me the total for each region. This is the kind of query you''d write on day one. Let''s
    run it.

    '
- id: e04_pause
  type: pause
  duration: 30.3
  transition: continuation
- id: e05
  type: run_query
  target: sql_viewer
  query_ref: live_totals_by_region
- id: e05_pause
  type: pause
  duration: 3.0
  transition: continuation
- id: e06
  type: show_result
  target: sql_viewer
  transition: continuation
  narration: 'Three rows back, one per region. Northeast comes in at fifteen thousand two hundred forty-one
    point two zero, with five orders. South shows eleven thousand eleven point five zero across four orders.
    And West lands at twelve thousand nine hundred five point seven five, also four orders. Looks clean.
    Looks right. No errors, no warnings. You''d feel pretty good about this, right? Yeah. Hold that thought.

    '
- id: e06_pause
  type: pause
  duration: 35.3
  transition: continuation

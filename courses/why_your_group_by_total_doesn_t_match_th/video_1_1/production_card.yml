  clears:
  - orders_causing_the_gap
  narration: 'And just to prove we''re not making this up, here''s a query that excludes those three orders
    and recalculates the totals. If our detective work is right, these corrected numbers should match
    the dashboard snapshot exactly. Let''s see.

    '
- id: e13_pause
  type: pause

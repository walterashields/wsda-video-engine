- id: e12
  type: show_result
  target: sql_viewer
  transition: continuation
  narration: 'Three orders. That''s it, just three rows causing all this chaos. Order one zero one one,
    placed on March fifteenth twenty twenty-four by Northwind Traders in the Northeast, order total two
    thousand eight hundred seventy-five point four zero. Hey, that matches the Northeast gap exactly.
    Then we''ve got order one zero one two from Coastal Dynamics out West, three thousand three hundred
    ten point zero zero, which is the West''s gap to the penny. And order one zero one three from Delta
    Farms Inc in the South, one thousand nine hundred sixty point two five, matching the South''s gap
    perfectly. Three late-arriving orders that the dashboard snapshot didn''t capture, but our live query
    picked up. Mystery solved, at least for this one.

    '
- id: e12_pause
  type: pause
  duration: 58.5
  transition: continuation

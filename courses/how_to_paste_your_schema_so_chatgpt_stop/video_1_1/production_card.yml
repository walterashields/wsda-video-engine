- id: e04b
  type: highlight_region
  target: chat_demo
  region: response-1
  callout: These column names are completely made up
  transition: continuation
  narration: 'Look at this. You asked ChatGPT for a query and it wrote something gorgeous. One problem,
    not a single one of these column names is real. It literally made them up. "customer_email"? Your
    database calls that "cust_eml" because Dave from IT set it up in two thousand seven and Dave did not
    believe in vowels. "last_order_date"? That''s actually "lst_ord_dt." And "orders_table"? It''s "tbl_ord_hist."
    You''ll paste this into your database tool, hit run, and get nothing but a wall of red errors. ChatGPT
    didn''t write you a query, it wrote you a wish.

    '

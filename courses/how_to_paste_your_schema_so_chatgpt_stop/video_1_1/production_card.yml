- id: e05
  type: new_conversation
  target: chat_demo
  title: The One-Paste Fix
  transition: new_concept
- id: e05_pause
  type: pause
  duration: 0.5
  transition: continuation
- id: e05b
  type: highlight_region
  target: chat_demo
  region: chat-area
  callout: This time we paste the schema first
  transition: new_concept
  narration: 'Here''s the fix and it takes three seconds. Go to your database, grab the CREATE TABLE statement,
    that''s basically the recipe card that lists every real column name your table actually has, and paste
    it right into ChatGPT before your question.

    '
- id: e05b_pause
  type: pause
  duration: 25.0
  transition: continuation
- id: e05c
  type: clear_highlight
  target: chat_demo
  transition: continuation

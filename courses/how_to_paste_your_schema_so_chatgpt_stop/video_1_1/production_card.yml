  transition: continuation
- id: e06
  type: show_message
  target: chat_demo
  text: "Here is my actual schema:\n\nCREATE TABLE tbl_ord_hist (\n  cust_eml VARCHAR(255),\n  lst_ord_dt\
    \ DATE,\n  ord_amt DECIMAL(10,2)\n);\n\nWrite me a query to find customers who have not ordered in\
    \ 90 days."
  region: prompt-2
  transition: continuation

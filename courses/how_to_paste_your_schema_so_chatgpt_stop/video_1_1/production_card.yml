  transition: continuation
- id: e07
  type: show_response
  target: chat_demo
  text: 'SELECT cust_eml, lst_ord_dt

    FROM tbl_ord_hist

    WHERE lst_ord_dt < DATEADD(day, -90, GETDATE());'
  region: response-2
  transition: continuation
- id: e07_pause
  type: pause
  duration: 1.0
  transition: continuation
- id: e07b
  type: highlight_region
  target: chat_demo
  region: response-2
  callout: Every column name is real this time
  transition: continuation
  narration: 'Now look. "cust_eml," "lst_ord_dt," "tbl_ord_hist." Every single column name is real. ChatGPT
    doesn''t have to guess anymore because you handed it the cheat sheet. It''s like giving someone directions
    versus saying "you''ll figure it out." One paste. That''s it. Stop letting the A-I improvise. Paste
    your schema.

    '

# Metabase PoC, video 1.3: "One Filter, Both Charts" (2026-08-15).
#
# Third video in this short course, written to prove API-seeded state
# generalizes past the one pair it was built and proven on (video_1_1 ->
# video_1_2), not just repeat it. Real UI selectors below (search
# navigation, the dashboard filter picker, field mapping) were discovered
# via a throwaway Playwright exploration script against the live demo
# instance before writing this script, same discipline as every prior
# video -- one exploration mistake avoided this way: search's input uses
# a real ellipsis character ("Search for anything…"), not three periods.
#
# Workflow, structurally different again from both priors: open the
# EXISTING dashboard from video_1_1/1_2 (not build a new question),
# enter dashboard edit mode, add a dashboard-level Date filter, connect
# it to BOTH existing charts' Created At field, save. Chosen as a natural
# next step in this course's actual arc: video 1 built one saved answer,
# video 2 built a second and pinned it alongside the first, so the
# obvious next capability is making the page those two charts share
# interactive, one control narrowing both, rather than building a third,
# unrelated chart.
#
# Opening narration calibrated against the transcripts again, specifically
# for how a THIRD video in a sequence differs from a second one -- it
# doesn't automatically. 05_04 (third video in that chapter's sequence)
# still uses the same light, scenario-continuation register as 05_03
# (second in sequence): "management is very impressed... thus far we've
# filtered quite a bit... in very much the same way..." -- no heavier
# formal recap just because it's video 3, but a brief "thus far"
# acknowledgment of accumulated progress that 05_03's opening (video 2)
# didn't need yet. 06_03 (third video after a chapter-opener) has almost
# no recap at all, since it continues the immediately preceding video's
# own task rather than opening a new stakeholder request. This video's
# new material (a dashboard filter) is a new stakeholder-facing request,
# closer to 05_04's shape than 06_03's, so the opening below briefly
# names BOTH existing artifacts (necessary here specifically because the
# whole point of this video is that ONE filter controls TWO things) but
# stays in the same light, story-driven register as video_1_2's opening,
# not a heavier chapter-style rundown.
#
# requires_state needed real extension to automation/state_seed.py, not
# just reuse -- the honest generalization finding for this pass:
#   1. "Monthly Revenue Trend" is a Sum/breakout chart, not a filtered
#      table like "High Value Orders". state_seed.py only supported
#      `filter` before this video; `aggregation` and `breakout` spec
#      keys were added specifically because this video needed them,
#      confirmed necessary by testing the old schema against this
#      question first and getting a plain KeyError, not by guessing it
#      would eventually need extending.
#   2. Extending it surfaced a real, separate bug: Metabase's actual
#      column name is CREATED_AT (underscore); this script (like a human
#      reading the UI) writes "Created At" (space). The original
#      field-lookup did a bare `.lower()` and happened to work for
#      one-word fields like "Total" by coincidence, then raised a
#      KeyError on the first two-word field. Fixed with a real
#      normalization helper (`_normalize_field_name`), not a special
#      case for this one field name.
# Both fixes verified directly against the live API, not assumed correct
# from reading the code: re-ran the query the seeded "Monthly Revenue
# Trend" produces and confirmed 49 rows of real monthly totals matching
# the UI-built version from the prior pass.
#
# open_saved_item, "label" and "index" locator kinds, and click_option
# reused for the filter-type/Done/Save steps are all new-or-extended
# driver mechanisms this video needed -- see automation/metabase_driver.py.
# See MULTI_VIDEO_PROGRESSION_FINDINGS.md for the full, honest account of
# what needed to change versus what held unmodified from video_1_2.
#
# open_saved_item (opening the dashboard) stays silent, same reasoning as
# select_database in video_1_1/1_2: which saved item to open is not a
# decision with reasoning to teach, per LESSON_CONTENT_STANDARD.md rule 3
# -- it's how you reach the screen where the actual lesson starts.
#
# Pause durations, two buffers depending on narration length:
#   short narration: duration = (word_count / 145) * 60 + 2.0s
#   long narration:  duration = (word_count / 145) * 60 + 8.0s
#   no narration (silent action): a short fixed 1.0s settle time

lesson_id: "metabase_poc_video_1_3"
title: "One Filter, Both Charts"
course: "metabase_poc"

target:
  base_url: "http://localhost:3000"
  admin_email: "admin@wsda.local"
  admin_password: "WsdaDemo123!"
  admin_first_name: "WSDA"
  admin_last_name: "Admin"
  site_name: "WSDA Metabase Demo"

# State this video opens and builds on, from video_1_1 and video_1_2,
# seeded via automation/state_seed.py before recording starts -- neither
# prior video needs to have actually run this pass. See
# MULTI_VIDEO_PROGRESSION_FINDINGS.md.
requires_state:
  - type: "question"
    name: "High Value Orders"
    database: "Sample Database"
    table: "Orders"
    display: "table"
    filter:
      field: "Total"
      operator: "between"
      min: 50
      max: 1000
  - type: "question"
    name: "Monthly Revenue Trend"
    database: "Sample Database"
    table: "Orders"
    display: "bar"
    aggregation:
      function: "sum"
      field: "Total"
    breakout:
      field: "Created At"
      granularity: "month"
  - type: "dashboard"
    name: "WSDA Metabase Demo Dashboard"
    contains: ["High Value Orders", "Monthly Revenue Trend"]

events:
  - id: "e00_intro"
    type: "narrate"
    narration: >-
      Your manager loves having both that High Value Orders list and the
      Monthly Revenue Trend chart in one place now, but she's started
      asking a narrower question: what did revenue look like just last
      quarter, not the whole multi-year history. Right now, answering
      that means rebuilding each chart by hand. By the end of this,
      you'll add one filter to the dashboard itself that narrows both of
      them together, so she can adjust the date range herself without
      ever asking you.
  - id: "e00_pause"
    type: "pause"
    duration: 41.5

  - id: "e01"
    type: "open_saved_item"
    name: "WSDA Metabase Demo Dashboard"
  - id: "e01_pause"
    type: "pause"
    duration: 1.0

  - id: "e02_hl"
    type: "highlight_target"
    pre_actions:
      - click: {"kind": "label", "value": "pencil icon"}
    locator: {"kind": "label", "value": "Add a filter or parameter"}
    lead_ms: 3000
    narration: >-
      We'll add a filter to the dashboard itself this time, not to
      either chart individually. A dashboard filter is a single control
      that can narrow down every chart pinned to it at once, instead of
      you editing each one separately.
  - id: "e02_pause"
    type: "pause"
    duration: 24.6
  - id: "e02_commit"
    type: "click_option"
    locator: {"kind": "label", "value": "Add a filter or parameter"}

  - id: "e03_hl"
    type: "highlight_targets"
    pre_actions:
      - click: {"kind": "text", "value": "Date picker"}
      - click: {"kind": "text", "value": "Select…", "index": 0}
      - click: {"kind": "text", "value": "Created At", "index": 0}
      - click: {"kind": "text", "value": "Select…", "index": 0}
      - click: {"kind": "text", "value": "Created At", "index": 0}
    locators:
      - {"kind": "text", "value": "Orders.Created At", "index": 0}
      - {"kind": "text", "value": "Orders.Created At", "index": 1}
    lead_ms: 3000
    narration: >-
      We're connecting this filter to Created At on both High Value
      Orders and Monthly Revenue Trend, the exact same field on both, so
      one date range narrows them together instead of you touching each
      chart on its own.
  - id: "e03_pause"
    type: "pause"
    duration: 23.7
  - id: "e03_commit"
    type: "click_option"
    locator: {"kind": "button", "value": "Done"}

  - id: "e04_hl"
    type: "highlight_target"
    locator: {"kind": "button", "value": "Save"}
    narration: >-
      We'll save this dashboard now, so the filter sticks around for
      her, not just for this session, the same way saving a question or
      pinning a chart made those stick around before.
  - id: "e04_pause"
    type: "pause"
    duration: 15.2
  - id: "e04_commit"
    type: "click_option"
    locator: {"kind": "button", "value": "Save"}

  - id: "e05"
    type: "show_result"
    narration: >-
      That's a dashboard filter added and connected to everything on the
      page. One control, both charts update together, and now she can
      check last quarter's revenue and which orders drove it herself,
      without pulling you in for every new date range.
  - id: "e05_pause"
    type: "pause"
    duration: 25.0

# Metabase Phase 2 proof-of-concept lesson script (fix pass 4, 2026-08-14).
#
# Consumed by automation/metabase_driver.py (records the run, writes an
# AuditLog-shaped audit.json) and then narration/audit_narrator.py (mixes
# in narration). Event `id` order here must exactly match the driver's
# audit log event order, positionally, since audit_narrator.py matches
# them by position/id, not timestamp.
#
# CHANGES THIS PASS (audio, pacing, content):
#   1. Audio: root cause of "no audio in final render" was not TTS or
#      muxing at all. automation/metabase_driver.py picked the source
#      webm to transcode via glob.glob(video_dir/"*.webm")[0]; video_dir
#      accumulates a .webm from every past run, uncleaned, and glob's
#      order kept returning the SAME leftover ~111s file from an early
#      session run every time, regardless of what had just actually been
#      recorded. run_lesson now gets the exact file for the page just
#      recorded from Playwright's own page.video().path() instead, with
#      no directory-scan ambiguity, plus a duration sanity check against
#      the driver's own measured wall-clock recording time as a safety
#      net. Separately, narration/audit_narrator.py now also logs which
#      TTS tier (ElevenLabs / edge-tts / say) actually produced each
#      clip, and hard-fails after render if the output has no audible
#      audio track, instead of reporting success on a silent video.
#      Nothing changed here in this script for either fix.
#   2. Pacing: automation/metabase_driver.py's HIGHLIGHT_LEAD_MS went
#      from 700ms to 1500ms, giving the eye more time to find a
#      highlighted element before its narration starts talking about it.
#      This delays the following pause's start (and therefore the
#      commit action's click) by the same amount; confirmed against real
#      audit.json timestamps after the change, not just the configured
#      constant (see the driver's comment on that constant).
#   3. Content: every narration line in this script was rewritten against
#      the new LESSON_CONTENT_STANDARD.md (repo root). Read against that
#      standard, essentially every line in the previous pass was
#      mechanical-only ("now we select Orders", "we'll create a new
#      dashboard to hold it") with no stated reason and no scenario
#      attached: the lesson filtered orders between $50 and $1,000 for
#      no given reason, and saved a question and pinned a dashboard for
#      no reason beyond "so it's easy to find later". This pass:
#        - Adds a lesson-opening scenario/outcome statement (a new
#          `narrate` event, e00_intro) before any action starts: a
#          manager wants a list of genuinely valuable customers for a
#          loyalty outreach, and by the end of the lesson the viewer can
#          produce that as a saved, shareable answer instead of a
#          one-off query someone has to keep asking for.
#        - Every remaining narration line now states a reason for the
#          step (why Orders and not People/Products, why $50-$1,000
#          specifically, why save as a question, why a dashboard), tied
#          back to that scenario, not just what's being clicked.
#        - No line assumes familiarity with Metabase's own vocabulary
#          ("question", "dashboard") without saying what that word means
#          here.
#      Pause durations recalculated for the new text using the existing
#      formula below (e03_pause bumped 7.8 -> 8.0 by narration/qa.py's
#      auto-fix after a live run: the edge-tts clip ran fractionally
#      longer than the formula estimated).
#
# CHANGES THIS PASS (fix pass 4, data-capture + transcript-grounded standard):
#   1. LESSON_CONTENT_STANDARD.md gained a 5th hard rule and a whole
#      section grounded in the transcripts of Walter's own flagship
#      LinkedIn Learning course: narration must never name a value,
#      column, or field that isn't visible and highlighted on screen at
#      that moment. Two real gaps in THIS script violated it before this
#      pass:
#        - The old e04 highlighted the generic word "Orders" while
#          narrating specific column names -- the columns themselves were
#          never shown, and the narration named columns ("customer",
#          "product") that don't even match this table's real headers
#          (User ID, Product ID). First attempt at a fix just pointed
#          highlight_targets at "User ID" text right after selecting the
#          table -- confirmed BROKEN live: that locator timed out,
#          because at that point in the flow the screen is still
#          Metabase's query-builder editor (Data/Filter/Summarize
#          sections), not a data grid. Column headers don't exist on
#          screen at all until after Visualize runs. Fixed by reordering
#          the events, not just adding a highlight: the column-discussion
#          beat (renamed e06, was e04) now runs AFTER visualize (e05, was
#          e06), where the real column headers are actually on screen,
#          confirmed by extracting a frame from a live recording. Filter
#          (renamed e04, was e05) now runs first, still inside the
#          editor view where it always worked. Narration also now names
#          the real headers (User ID, Product ID) instead of invented
#          ones.
#      - The filter step (e04_hl) highlighted only the closed "Add
#          filters..." button while narrating the actual filter numbers
#          (50 and 1000) -- neither number was ever visible. Now uses
#          highlight_target's new pre_actions to open the picker, choose
#          the Total field, and type both values BEFORE the
#          highlight/narration, then highlights both the Min and Max
#          inputs (highlight_targets) so the real numbers being discussed
#          are on screen throughout. e04_commit (add_filter) now only
#          submits; it no longer opens the picker or types the values
#          itself, since pre_actions already did that -- see
#          automation/metabase_driver.py's action_add_filter docstring.
#   2. LESSON_CONTENT_STANDARD.md also now flags (not fixed here) that
#      this single-video PoC can't yet exhibit the proven course's
#      chapter-opener/challenge structure, since there's no other video
#      in this "chapter" to recap against or apply the skill against
#      independently. See the standard's "Where metabase_poc still falls
#      short" section.
#
# select_database and visualize stay un-highlighted and un-narrated:
# they're silent, administrative clicks with nothing to teach (per
# LESSON_CONTENT_STANDARD.md, silence is only for steps that genuinely
# carry no reasoning to teach, not a default).
#
# Pause durations, two buffers depending on narration length:
#   short narration: duration = (word_count / 145) * 60 + 2.0s
#   long narration:  duration = (word_count / 145) * 60 + 8.0s
#   no narration (silent action): a short fixed 1.0s settle time

lesson_id: "metabase_poc_video_1_1"
title: "Build Your First Question in Metabase"
course: "metabase_poc"

target:
  base_url: "http://localhost:3000"
  admin_email: "admin@wsda.local"
  admin_password: "WsdaDemo123!"
  admin_first_name: "WSDA"
  admin_last_name: "Admin"
  site_name: "WSDA Metabase Demo"

events:
  - id: "e00_intro"
    type: "narrate"
    narration: >-
      Your manager wants a list of your best customers, people worth a
      personal thank-you, but that list doesn't exist yet. It's buried
      in raw order data. By the end of this, you'll turn that data into
      a saved answer she can check herself, anytime.
  - id: "e00_pause"
    type: "pause"
    duration: 26.2

  - id: "e01_hl"
    type: "highlight_target"
    locator: {"kind": "app_bar_button", "name": "New"}
    narration: >-
      We'll start a new question, since in Metabase every saved answer
      begins as one.
  - id: "e01_pause"
    type: "pause"
    duration: 7.8
  - id: "e01_commit"
    type: "click_new_question"

  - id: "e02"
    type: "select_database"
    database: "Sample Database"
  - id: "e02_pause"
    type: "pause"
    duration: 1.0

  - id: "e03_hl"
    type: "highlight_target"
    locator: {"kind": "text", "value": "Orders"}
    narration: >-
      We're using Orders, not People or Products, since best customers
      means real money spent.
  - id: "e03_pause"
    type: "pause"
    duration: 8.0
  - id: "e03_commit"
    type: "select_table"
    table: "Orders"

  - id: "e04_hl"
    type: "highlight_targets"
    pre_actions:
      - click: {"kind": "text", "value": "Add filters to narrow your answer"}
      - click: {"kind": "text", "value": "Total"}
      - fill: {"kind": "placeholder", "value": "Min"}
        text: "50"
      - fill: {"kind": "placeholder", "value": "Max"}
        text: "1000"
    locators:
      - {"kind": "placeholder", "value": "Min"}
      - {"kind": "placeholder", "value": "Max"}
    narration: >-
      We'll filter Total between fifty and a thousand dollars, since
      anything less isn't worth a personal outreach, and anything more
      is already handled by sales.
  - id: "e04_pause"
    type: "pause"
    duration: 12.3
  - id: "e04_commit"
    type: "add_filter"

  - id: "e05"
    type: "visualize"
  - id: "e05_pause"
    type: "pause"
    duration: 1.0

  - id: "e06"
    type: "highlight_targets"
    locators:
      - {"kind": "text", "value": "User ID"}
      - {"kind": "text", "value": "Product ID"}
      - {"kind": "text", "value": "Total"}
    narration: >-
      Each row here is one purchase. User ID tells us who bought it,
      Product ID tells us what they bought, and Total is what they
      paid, the number that actually tells us whether an order is
      worth following up on.
  - id: "e06_pause"
    type: "pause"
    duration: 24.6
  - id: "e06_clear"
    type: "clear_highlight"

  - id: "e07"
    type: "highlight_section"
    selector_text: "Total is between 50 and 1000"
    narration: >-
      This is the list your manager actually wanted. Every row here is
      a real purchase in the fifty to a thousand dollar range, exactly
      who's worth reaching out to. Right now it's still just a query
      result though, nothing is saved yet.
  - id: "e07_pause"
    type: "pause"
    duration: 25.4
  - id: "e07_clear"
    type: "clear_highlight"

  - id: "e08_hl"
    type: "highlight_target"
    locator: {"kind": "test_id", "value": "qb-save-button"}
    narration: >-
      We'll save this as a question now, so it becomes something we can
      come back to without rebuilding it.
  - id: "e08_pause"
    type: "pause"
    duration: 9.9
  - id: "e08_commit"
    type: "save_question"
    question_name: "High Value Orders"

  - id: "e09_hl"
    type: "highlight_target"
    locator: {"kind": "text", "value": "New dashboard"}
    narration: >-
      We'll create a new dashboard, since that's where saved questions
      live, somewhere your manager can check on her own.
  - id: "e09_pause"
    type: "pause"
    duration: 9.9
  - id: "e09_commit"
    type: "add_to_dashboard"
    dashboard_name: "WSDA Metabase Demo Dashboard"

  - id: "e10"
    type: "show_result"
    narration: >-
      That's the whole path from a question to an answer someone else
      can use. Filter to the customers who matter, save it as a
      question, pin it to a dashboard, and now that best customer list
      your manager wanted isn't a favor you do once. It's something she
      can check herself, anytime.
  - id: "e10_pause"
    type: "pause"
    duration: 29.5

  - id: "e15"
    type: "show_message"
    target: "chat_demo"
    text: "There is so much hype out there. Can you help me separate the myths from reality? What do most people get wrong about AI?"
    region: "prompt-3"
    transition: "continuation"
  - id: "e15_pause"
    type: "pause"
    duration: 0.5
    transition: "continuation"
  - id: "e16"
    type: "show_response"
    target: "chat_demo"
    text: "Great question! Here are 5 common myths:\n\n**Myth 1: AI thinks like a human brain.**\n❌ Myth. AI finds statistical patterns in data. It does not understand, feel, or have awareness.\n\n**Myth 2: AI will replace all jobs.**\n⚠️ Nuance. AI will change many jobs and eliminate some tasks, but it mostly augments human work. People who learn to use AI tools will replace people who do not.\n\n**Myth 3: AI is always right.**\n❌ Myth. AI makes mistakes, reflects biases in its training data, and can confidently give wrong answers.\n\n**Myth 4: You need to code to use AI.**\n❌ Myth. Most modern AI tools are designed for non-technical users. If you can type a sentence, you can use AI.\n\n**Myth 5: AI is brand new.**\n❌ Myth. The field started in the 1950s. What is new is the computing power and data that made recent breakthroughs possible."
    region: "response-3"
    transition: "continuation"
  - id: "e16_pause"
    type: "pause"
    duration: 1.0
    transition: "continuation"
  - id: "e17"
    type: "highlight_region"
    target: "chat_demo"
    region: "response-3"
    callout: "5 AI myths busted"
    transition: "continuation"
    narration: >
      Let us walk through these five myths one at a time because I guarantee you have heard at least
      a couple of them from colleagues or from the news. Myth number one, AI thinks like a human
      brain. This is flat out false. AI does not think, it does not feel, it does not have
      consciousness. What it does is find statistical patterns in massive amounts of data. When a
      chatbot gives you a really impressive answer, it is not because it understands you. It is
      because it learned patterns in billions of sentences and it is predicting what words should
      come next. Myth number two, AI will replace all jobs. This one gets a nuance stamp rather than
      a simple myth label. AI absolutely will change many jobs and it will automate certain tasks.
      But here is the more accurate way to think about it, people who learn to use AI will replace
      people who do not. AI is a power tool, not a replacement worker. Myth number three, AI is
      always right. Definitely a myth. AI makes mistakes all the time. It can reflect biases that
      exist in its training data, and it can confidently give you a completely wrong answer with a
      straight face. That is why human judgment still matters enormously. Myth number four, you need
      to know how to code to use AI. This was somewhat true ten years ago, but today it is a myth.
      Most modern AI tools are built specifically for non-technical people. If you can type a
      sentence, you can use AI. That is exactly what this course is going to prove to you. Myth
      number five, AI is brand new. The field of artificial intelligence actually started all the way
      back in the nineteen fifties. What changed recently is that we finally have enough computing
      power and enough data to make the big breakthroughs possible. So AI is not new, but the
      current wave of incredibly useful AI tools is new, and that is what makes right now such an
      exciting time to learn.

  - id: "e05"
    type: "show_message"
    target: "chat_demo"
    text: "I keep hearing about AI everywhere, but I don't think I actually use it in my daily life. Do I?"
    region: "prompt-1"
    transition: "continuation"
  - id: "e05_pause"
    type: "pause"
    duration: 0.5
    transition: "continuation"
  - id: "e06"
    type: "show_response"
    target: "chat_demo"
    text: "You absolutely do! Here are 3 examples you probably used today:\n\n1. **Email Spam Filter** — Gmail or Outlook uses AI to decide which emails are junk. It learned from billions of examples what spam looks like.\n\n2. **Photo Search** — When you search your phone's photo library for \"dog\" or \"beach,\" AI recognizes what is in each image. Nobody manually tagged those photos.\n\n3. **Map Route Suggestions** — Google Maps or Waze predicts traffic and picks the fastest route. It learns from millions of drivers' real-time data.\n\nAll three learn from data and make predictions — that is what makes them AI, not just simple automation."
    region: "response-1"
    transition: "continuation"
  - id: "e06_pause"
    type: "pause"
    duration: 1.0
    transition: "continuation"
  - id: "e07"
    type: "highlight_region"
    target: "chat_demo"
    region: "response-1"
    callout: "3 AI examples you already use every day"
    transition: "continuation"
    narration: >
      Take a look at these three examples on screen. Number one, your email spam filter. Every time
      you open your inbox and it is not flooded with junk mail, that is AI working behind the scenes.
      It learned from billions of emails what spam looks like, things like suspicious links, certain
      phrases, unusual sender patterns, and it makes a prediction for every new message that arrives.
      Number two, photo search on your phone. When you type the word dog into your photo library and
      it pulls up every picture of your golden retriever, nobody sat there and labeled those photos
      by hand. An AI model was trained on millions of images so it could recognize objects, faces,
      and scenes all on its own. Number three, map route suggestions. When Google Maps tells you to
      take the highway instead of side streets because there is a wreck on Main Street, that is AI
      analyzing real-time data from millions of other drivers and predicting which route will be
      fastest for you right now. The key thing all three have in common is that they learn from data
      and they make predictions. They are not just following a simple if-then rule that a programmer
      typed out. That learning piece is what separates AI from plain old automation.

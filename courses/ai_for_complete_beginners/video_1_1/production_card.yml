    target: "chat_demo"
    text: "Let's try 2 together, then you will do the rest on your own!\n\n**Scenario 1:** A thermostat turns on the heater when the temperature drops below 68°F.\n\n**Scenario 2:** Netflix recommends a show you have never heard of, and you end up loving it."
    region: "response-4"
    transition: "continuation"
  - id: "e21_pause"
    type: "pause"
    duration: 1.0
    transition: "continuation"
  - id: "e22"
    type: "highlight_region"
    target: "chat_demo"
    region: "response-4"
    callout: "Let us reason through these together"
    transition: "continuation"
    narration: >
      OK here is where it gets fun. Let us work through these two scenarios together and I want you
      to think about the answer before I give it. Scenario number one, a thermostat turns on the
      heater when the temperature drops below sixty eight degrees Fahrenheit. Is that AI? The answer
      is no, that is simple automation. A human programmed one rule, if the temperature is below
      sixty eight, turn on the heater. There is no learning happening, no data being analyzed, no
      predictions being made. It is just a fixed rule, and the thermostat follows it every single
      time the same way. Now scenario number two, Netflix recommends a show you have never heard of
      and you end up loving it. Is that AI? Yes, that is absolutely AI. Netflix analyzes your
      viewing history, the viewing history of millions of other users, ratings, how long people
      watched before turning something off, and dozens of other data points. It learns patterns
      across all of that data and then it predicts what you specifically are likely to enjoy. Nobody
      at Netflix sat down and wrote a rule that says if this person watched three crime dramas,
      recommend this documentary. The system figured that out on its own from the data. See the
      difference? The thermostat follows one fixed rule. Netflix learns from data and makes
      predictions. That learning and predicting is the signature of AI.

  - id: "e31"
    type: "highlight_region"
    target: "chat_demo"
    region: "response-6"
    callout: "Your key takeaway"
    transition: "emphasis"
    narration: >
      Let us bring it all home. Look at the key takeaway on screen. AI is software that learns
      patterns from data to make predictions or decisions. It is not magic. It is not sentient. And
      you already use it every single day. You walked into this lesson maybe feeling a little
      overwhelmed by all the AI buzz, and now you can do three things you could not do before.
      First, you can define artificial intelligence in plain English. It is software that learns from
      data instead of following hard-coded rules. Second, you can tell the difference between AI
      and simple automation. Remember, the thermostat follows a fixed rule, Netflix learns from
      data. Third, you can point to at least three real-world examples of AI you already use, your
      spam filter, your photo search, and your map directions. That is a huge step forward, and you
      should feel good about it. In the next lesson, we are going to explore the different types of
      AI that you see in headlines and at work. We will talk about narrow AI versus general AI, and
      why that distinction matters for your career. I will see you there.

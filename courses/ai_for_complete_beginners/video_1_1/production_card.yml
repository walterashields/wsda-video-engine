  - id: "e10"
    type: "show_message"
    target: "chat_demo"
    text: "OK, so those are examples. But can you give me a simple definition of AI that I can actually remember?"
    region: "prompt-2"
    transition: "continuation"
  - id: "e10_pause"
    type: "pause"
    duration: 0.5
    transition: "continuation"
  - id: "e11"
    type: "show_response"
    target: "chat_demo"
    text: "Here is the simplest way to think about it:\n\n**Traditional Programming:**\nRules go in → Answers come out.\nA human writes every rule. The computer just follows instructions.\n\n**Artificial Intelligence:**\nData goes in → Patterns are learned → Predictions come out.\nThe computer figures out the rules by studying examples.\n\n**3 terms to remember:**\n• **Machine Learning** — the most common type of AI. The system improves by studying more data.\n• **Training Data** — the examples the AI learns from (emails, photos, driving routes).\n• **Model** — the finished \"recipe\" the AI uses to make predictions on new data it has never seen before."
    region: "response-2"
    transition: "continuation"
  - id: "e11_pause"
    type: "pause"
    duration: 1.0
    transition: "continuation"
  - id: "e12"
    type: "highlight_region"
    target: "chat_demo"
    region: "response-2"
    callout: "Traditional programming vs. AI"
    transition: "continuation"
    narration: >
      This is the single most important idea in the entire course, so let us make sure it really
      clicks. Look at the comparison on screen. With traditional programming, a human developer
      writes every rule by hand. If the temperature is below thirty two degrees, display a frost
      warning. Rules go in, answers come out. The computer is just following a script. With
      artificial intelligence, it works the other way around. You feed the system a huge pile of
      data, thousands or millions of examples, and the system figures out the patterns on its own.
      Then it uses those patterns to make predictions about new data it has never seen before.
      Nobody wrote a rule that says this photo contains a dog. Instead, the AI looked at millions
      of dog photos and learned what dog-ness looks like. Now there are three vocabulary terms on
      screen that I want you to tuck away. First, machine learning. This is the most common flavor
      of AI you will encounter. It just means the system gets better the more data it studies.
      Second, training data. These are the examples the AI learns from. For a spam filter, the
      training data is billions of emails that were already labeled as spam or not spam. Third,
      model. Think of the model as the finished recipe. Once the AI has studied all that training
      data, the model is what it produces, a set of learned patterns it can apply to brand new data
      it has never encountered. You do not need to memorize textbook definitions. Just remember,
      traditional programming is humans writing rules, AI is machines learning rules from data.

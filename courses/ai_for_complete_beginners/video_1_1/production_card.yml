    transition: "new_concept"
    narration: >
      Welcome to your very first lesson on artificial intelligence. I know that phrase can sound
      intimidating, maybe even a little sci-fi. But here is the truth, you already use AI every
      single day, and by the end of the next few minutes you are going to know exactly what it is,
      what it is not, and why you do not need to be a programmer to understand it. So take a breath,
      grab your coffee, and let us dive in together.

schema_version: "3.0"
lesson_id: "ai_beginners_1_3"
title: "Hands On with ChatGPT: Your First AI Conversation"
course: "AI for Complete Beginners"

assets:
  demo: "chat"

events:

  # ── Opening ────────────────────────────────────────────────────
  - id: "e01"
    type: "open_chat"
    target: "chat_demo"
    user_name: "Walter Shields"
    initials: "WS"
    transition: "new_concept"

  - id: "e01_pause"
    type: "pause"
    duration: 2.0
    transition: "continuation"

  - id: "e01b"
    type: "highlight_region"
    target: "chat_demo"
    region: "chat-area"
    callout: "Your AI workspace"
    transition: "new_concept"
    narration: >
      Okay so this right here — this is ChatGPT.
      You get to this by going to chat dot openai dot com.
      Free account, no credit card, takes two minutes to set up.
      Left side is your conversation history.
      Center is where the AI talks back to you.
      Bottom is where you type.
      Simple setup. But what you do with it?
      That is where it gets interesting.
      I am going to show you something first
      that most people do wrong every single time they open this.

  - id: "e01b_pause"
    type: "pause"
    duration: 45.0
    transition: "continuation"

  - id: "e01c"
    type: "clear_highlight"
    target: "chat_demo"
    transition: "continuation"

  - id: "e01c_pause"
    type: "pause"
    duration: 0.3
    transition: "continuation"

  # ── The bad prompt ─────────────────────────────────────────────
  - id: "e02"
    type: "new_conversation"
    target: "chat_demo"
    title: "Marketing help"
    transition: "new_concept"

  - id: "e02_pause"
    type: "pause"
    duration: 0.5
    transition: "continuation"

  - id: "e03"
    type: "show_message"
    target: "chat_demo"
    text: "Help me with marketing"
    region: "bad-prompt"
    transition: "continuation"

  - id: "e03_pause"
    type: "pause"
    duration: 0.5
    transition: "continuation"

  - id: "e04"
    type: "show_response"
    target: "chat_demo"
    text: >
      Sure! Here are some general marketing strategies:

      1. Define your target audience — Know who your customers are.
      2. Build a social media presence — Use Instagram, Facebook, or LinkedIn.
      3. Create valuable content — Blog posts and videos attract customers organically.
      4. Email marketing — Build a list and send regular newsletters.
      5. Paid advertising — Consider Google Ads or social media ads.
      6. Track your results — Use analytics to see what is working.

      Would you like more detail on any of these?
    region: "bad-response"
    transition: "continuation"

  - id: "e04_pause"
    type: "pause"
    duration: 1.0
    transition: "continuation"

  - id: "e04b"
    type: "highlight_region"
    target: "chat_demo"
    region: "bad-prompt"
    callout: "Four words. That is it."
    transition: "continuation"
    narration: >
      Four words. Help me with marketing.
      That is it. That is the entire prompt.
      And look what came back.

  - id: "e04b_pause"
    type: "pause"
    duration: 14.0
    transition: "continuation"

  - id: "e04c"
    type: "highlight_region"
    target: "chat_demo"
    region: "bad-response"
    callout: "Generic. Useless. Not your fault — the prompt was the problem."
    transition: "continuation"
    narration: >
      Six bullet points of the most generic marketing advice you have ever seen.
      Define your audience. Build a social media presence.
      This is stuff from a textbook written in 2009.
      The AI is not broken. It just had nothing to work with.
      You gave it nothing specific, so it gave you nothing useful.
      The fix is not a better AI. The fix is a better prompt.

  - id: "e04c_pause"
    type: "pause"
    duration: 32.0
    transition: "continuation"

  - id: "e04d"
    type: "clear_highlight"
    target: "chat_demo"
    transition: "continuation"

  - id: "e04d_pause"
    type: "pause"
    duration: 0.3
    transition: "continuation"

  # ── The structured prompt ───────────────────────────────────────
  - id: "e05"
    type: "new_conversation"
    target: "chat_demo"
    title: "30-day bakery plan"
    transition: "new_concept"

  - id: "e05_pause"
    type: "pause"
    duration: 0.5
    transition: "continuation"

  - id: "e06"
    type: "show_message"
    target: "chat_demo"
    text: "Act as an experienced digital marketing strategist for small businesses. Create a 30-day social media content plan for a local bakery that just opened. Present this as a weekly table with columns for Day, Platform, Content Type, and Caption Idea. Focus only on Instagram and Facebook, keep the tone warm and community-focused, and assume a budget of zero dollars for paid ads."
    region: "structured-prompt"
    transition: "new_concept"

  - id: "e06_pause"
    type: "pause"
    duration: 1.0
    transition: "continuation"

  - id: "e06b"
    type: "highlight_region"
    target: "chat_demo"
    region: "structured-prompt"
    callout: "Role — Task — Format — Constraints"
    transition: "continuation"
    narration: >
      Same question. Completely different prompt.
      Read what is highlighted on your screen.
      There are four parts to this and once you see them
      you will never write a bad prompt again.
      First line: Role. Act as an experienced digital marketing strategist.
      That tells the AI who to be. What lens to think through.
      Second part: Task. Create a thirty-day social media content plan
      for a local bakery that just opened.
      Specific. Detailed. Not just help with marketing.
      Third part: Format. A weekly table with four specific columns.
      Tell it how you want the answer structured.
      Last part: Constraints. Instagram and Facebook only,
      warm community tone, zero dollar budget.
      Those guardrails keep it focused on exactly what you need.
      Role. Task. Format. Constraints.
      Write that on a sticky note. Put it on your monitor.
      That framework will make you look like a pro
      every single time you use AI.

  - id: "e06b_pause"
    type: "pause"
    duration: 75.0
    transition: "continuation"

  - id: "e06c"
    type: "clear_highlight"
    target: "chat_demo"
    transition: "continuation"

  - id: "e06c_pause"
    type: "pause"
    duration: 0.3
    transition: "continuation"

  - id: "e07"
    type: "show_response"
    target: "chat_demo"
    text: >
      Here is your 30-Day Social Media Content Plan:

      WEEK 1 — Grand Opening Energy

      Day 1 | Instagram | Photo Post | "Grand opening! Come say hi and grab a free cookie with any purchase today only."
      Day 2 | Facebook | Community Poll | "What flavor should we bake next? Vote below!"
      Day 3 | Instagram | Behind the Scenes | "4am and the ovens are already on. This is what fresh looks like."
      Day 4 | Facebook | Customer Feature | "Tag a friend who deserves a treat today."
      Day 5 | Instagram | Product Spotlight | "Meet our sourdough. Three days of fermentation. Worth every minute."
      Day 6 | Facebook | Saturday Story | "Saturday morning vibes. Come in and stay a while."
      Day 7 | Instagram | Weekly Recap | "What a first week. Thank you for showing up for us."

      WEEK 2 — Building Community

      Day 8 | Instagram | Recipe Tip | "The secret to a perfect croissant? Patience."
      Day 9 | Facebook | Local Feature | "Shoutout to our neighbors at the flower shop next door."
      Day 10 | Instagram | Staff Spotlight | "Meet Maria, who has been baking bread for 22 years."
    region: "good-response"
    transition: "continuation"

  - id: "e07_pause"
    type: "pause"
    duration: 1.5
    transition: "continuation"

  - id: "e07b"
    type: "highlight_region"
    target: "chat_demo"
    region: "good-response"
    callout: "This is what a good prompt looks like"
    transition: "emphasis"
    narration: >
      Look at what came back.
      Day one: grand opening, free cookie, specific call to action.
      Day two: a poll asking customers what to bake next.
      Day five: a story about their sourdough and why it takes three days.
      Every single one is Instagram or Facebook.
      Every single one has a warm, community feel.
      Zero ad budget anywhere.
      This is not generic. This is a content calendar
      a real bakery owner could actually use tomorrow.
      Same AI. Same tool. Completely different output.
      Because we gave it a real prompt.

  - id: "e07b_pause"
    type: "pause"
    duration: 52.0
    transition: "continuation"

  - id: "e07c"
    type: "clear_highlight"
    target: "chat_demo"
    transition: "continuation"

  - id: "e07c_pause"
    type: "pause"
    duration: 0.3
    transition: "continuation"

  # ── Iteration ──────────────────────────────────────────────────
  - id: "e08"
    type: "show_message"
    target: "chat_demo"
    text: "This is great. Can you make Week 1 more focused on building email subscribers instead of general awareness?"
    region: "iteration-prompt"
    transition: "new_concept"

  - id: "e08_pause"
    type: "pause"
    duration: 0.5
    transition: "continuation"

  - id: "e08b"
    type: "highlight_region"
    target: "chat_demo"
    region: "iteration-prompt"
    callout: "One sentence. That is all it takes."
    transition: "continuation"
    narration: >
      Here is the part that gets people.
      I did not rewrite the prompt.
      I typed one sentence.
      The AI remembers everything — the bakery,
      the two platforms, the community tone, the zero budget.
      All of it is still in context.
      I just told it what to change about Week One.
      That is iteration. And this is where the real power is.
      You do not start over. You refine.

  - id: "e08b_pause"
    type: "pause"
    duration: 42.0
    transition: "continuation"

  - id: "e08c"
    type: "clear_highlight"
    target: "chat_demo"
    transition: "continuation"

  - id: "e08c_pause"
    type: "pause"
    duration: 0.3
    transition: "continuation"

  - id: "e09"
    type: "show_response"
    target: "chat_demo"
    text: >
      Great idea! Here is a revised Week 1 focused on growing your email list:

      Day 1 | Instagram | Photo Post | "Grand opening special: sign up for our email list at the counter and get 10% off your next visit."
      Day 2 | Facebook | Lead Gen Post | "Want to be the first to know about new flavors? Join our bakers list — link in comments."
      Day 3 | Instagram | Behind the Scenes | "4am in the kitchen. Join our email list to get weekly updates straight from us."
      Day 4 | Facebook | Incentive Post | "Email subscribers get early access to our Saturday special before we announce it publicly."
      Day 5 | Instagram | Social Proof | "47 people joined our bakers list this week. Here is what they are most excited for."
      Day 6 | Facebook | Reminder | "Last chance to join our launch week subscriber list and get the founding member discount."
      Day 7 | Instagram | Thank You | "To everyone who subscribed this week — you are getting something special next Tuesday."
    region: "iteration-response"
    transition: "continuation"

  - id: "e09_pause"
    type: "pause"
    duration: 1.5
    transition: "continuation"

  - id: "e09b"
    type: "highlight_region"
    target: "chat_demo"
    region: "iteration-response"
    callout: "Same AI. One pivot. Completely different direction."
    transition: "emphasis"
    narration: >
      Week One is completely rebuilt around email growth.
      Day one: sign up at the counter, get ten percent off your next visit.
      Day four: subscribers get early access before the public announcement.
      Day five: social proof — forty seven people already signed up.
      The AI kept the warm tone, the Instagram and Facebook focus,
      the zero dollar budget. It just changed the goal.
      One follow-up sentence.
      That is how you work with AI. Not as a search engine.
      As a collaborator you keep pushing until it is right.

  - id: "e09b_pause"
    type: "pause"
    duration: 48.0
    transition: "continuation"

  - id: "e09c"
    type: "clear_highlight"
    target: "chat_demo"
    transition: "continuation"

  - id: "e09c_pause"
    type: "pause"
    duration: 0.3
    transition: "continuation"

  # ── Closing ────────────────────────────────────────────────────
  - id: "e10"
    type: "highlight_region"
    target: "chat_demo"
    region: "input-box"
    callout: "Your turn — try it right now"
    transition: "emphasis"
    narration: >
      Role. Task. Format. Constraints.
      That is the whole thing.
      Take something from your actual job this week.
      An email you have been putting off.
      A plan you need to draft. A presentation outline.
      Open ChatGPT, use the framework, and watch what happens.
      The first time it actually works for you — and it will —
      something clicks. And you will not go back.
      Next lesson we talk about what to do
      when the AI gets it wrong.
      Because it will get it wrong.
      And knowing how to catch it
      is just as important as knowing how to prompt it.
      See you there.

  - id: "e10_pause"
    type: "pause"
    duration: 58.0
    transition: "continuation"

  - id: "e11"
    type: "fade_out"
    target: "all"
    transition: "emphasis"

- id: e07
  type: show_message
  target: chat_demo
  text: Wait — that query uses INNER JOIN. Wouldn't that drop customers who had zero orders last month?
    Should it be a LEFT JOIN instead?
  region: prompt-2
  transition: new_concept
- id: e07_pause
  type: pause
  duration: 0.5
  transition: continuation
- id: e08
  type: show_response
  target: chat_demo
  text: 'You''re right! An INNER JOIN only returns customers who have matching rows in the orders table.
    Customers with zero orders last month are silently excluded.


    • INNER JOIN result: 112 customers

    • LEFT JOIN result: 187 customers

    • Customers silently dropped: 75 (40% of the customer base)


    The corrected query should use LEFT JOIN and COALESCE to show zero-revenue customers:


    SELECT c.customer_id, c.customer_name, COALESCE(SUM(o.amount), 0) AS total_revenue

    FROM customers c

    LEFT JOIN orders o ON c.customer_id = o.customer_id

    AND o.order_date >= DATE_TRUNC(''month'', CURRENT_DATE - INTERVAL ''1 month'')

    AND o.order_date < DATE_TRUNC(''month'', CURRENT_DATE)

    GROUP BY c.customer_id, c.customer_name

    ORDER BY total_revenue DESC;'
  region: response-2
  transition: continuation
- id: e08_pause
  type: pause
  duration: 1.0
  transition: continuation
- id: e08b
  type: highlight_region
  target: chat_demo
  region: response-2
  callout: 75 customers vanished — no error, no warning
  transition: emphasis
  narration: 'There it is. That one word, INNER instead of LEFT, silently erased seventy-five customers
    from the results. The A-I''s query returned one hundred twelve customers. The correct query returns
    one hundred eighty-seven. That''s forty percent of the entire customer base, just gone. And here''s
    the terrifying part, there was no error message, no warning, no red flag. The output looked completely
    normal. Just a nice clean table of numbers. Completely wrong numbers.

    '

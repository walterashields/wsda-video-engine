- id: e04
  type: show_message
  target: chat_demo
  text: Write a SQL query to find total revenue per customer last month.
  region: prompt-1
  transition: continuation
- id: e04_pause
  type: pause
  duration: 0.5
  transition: continuation
- id: e05
  type: show_response
  target: chat_demo
  text: 'SELECT c.customer_id, c.customer_name, SUM(o.amount) AS total_revenue

    FROM customers c

    INNER JOIN orders o ON c.customer_id = o.customer_id

    WHERE o.order_date >= DATE_TRUNC(''month'', CURRENT_DATE - INTERVAL ''1 month'')

    AND o.order_date < DATE_TRUNC(''month'', CURRENT_DATE)

    GROUP BY c.customer_id, c.customer_name

    ORDER BY total_revenue DESC;'
  region: response-1
  transition: continuation
- id: e05_pause
  type: pause
  duration: 1.0
  transition: continuation
- id: e05b
  type: highlight_region
  target: chat_demo
  region: response-1
  callout: Looks clean. Looks professional. But...
  transition: continuation
  narration: 'Look at that. Beautiful S-Q-L. Clean formatting, nice aliases, even threw in an ORDER BY
    for us. If you''re new to this, you''d look at that and think, perfect, ship it. And honestly? That''s
    exactly what I did the first time I got something like this back. I ran it. Got my numbers. Sent it
    to my boss. Done. Except it wasn''t done, because this query has a silent, invisible problem hiding
    in plain sight.

    '

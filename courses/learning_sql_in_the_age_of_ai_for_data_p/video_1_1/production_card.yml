- id: e11
  type: show_message
  target: chat_demo
  text: So should I stop using AI to write SQL?
  region: prompt-3
  transition: continuation
- id: e11_pause
  type: pause
  duration: 0.5
  transition: continuation
- id: e12
  type: show_response
  target: chat_demo
  text: 'No! AI is a powerful SQL writing tool. But you need the skill to verify what it gives you.


    🔑 The essential skill:

    • AI writes SQL → fast, convenient

    • YOU read SQL → accurate, accountable


    ❌ Your boss won''t accept: "ChatGPT wrote it"

    ✅ Your boss will respect: "I checked the logic myself"


    You don''t need to become a SQL wizard. You need to learn enough SQL to read what AI gives you and
    spot when it''s wrong. That''s the skill. That''s the job security.'
  region: response-3
  transition: continuation
- id: e12_pause
  type: pause
  duration: 1.0
  transition: continuation
- id: e12b
  type: highlight_region
  target: chat_demo
  region: response-3
  callout: Learn SQL. Not because AI can't write it. Because AI can't be accountable for it.
  transition: emphasis
  narration: 'Look, A-I''s amazing at writing S-Q-L. I use it every single day. But here''s the thing
    nobody tells beginners. A-I isn''t responsible for your data. You are. Your boss isn''t going to accept
    "well, ChatGPT wrote it" as an excuse when seventy-five customers vanish from a report. You don''t
    need to become a S-Q-L wizard. But you absolutely need to learn enough S-Q-L to read what A-I gives
    you and spot when it''s lying to your face. That''s the skill. That''s the job security. Let''s go
    learn S-Q-L.

    '

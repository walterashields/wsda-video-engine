    narration: >
      Your A I just tripled every customer's revenue, and the query ran without a single error. No red text, no warnings, nothing. Just a clean result set full of numbers that are three times too high. That's the scariest kind of bug, the kind that looks completely right. Today I'll show you exactly how it happens, why a perfectly reasonable-looking JOIN causes it, and the five-second side-by-side check that catches it every time.

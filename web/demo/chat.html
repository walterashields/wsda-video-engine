<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGPT — Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #212121;
    --sidebar:   #171717;
    --surface:   #2f2f2f;
    --border:    #3f3f3f;
    --text:      #ececec;
    --text-dim:  #8e8e8e;
    --accent:    #19c37d;
    --user-bg:   #2f2f2f;
    --ai-bg:     transparent;
    --input-bg:  #2f2f2f;
    --radius:    12px;
    --font:      -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 260px;
    background: var(--sidebar);
    display: flex;
    flex-direction: column;
    padding: 12px 8px;
    border-right: 1px solid var(--border);
    flex-shrink: 0;
  }

  .sidebar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px 16px;
    font-weight: 600;
    font-size: 15px;
  }

  .sidebar-logo svg {
    width: 24px; height: 24px;
    background: var(--text);
    border-radius: 50%;
    padding: 3px;
  }

  .new-chat-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
    border: 1px solid var(--border);
    background: transparent;
    margin-bottom: 16px;
    transition: background 0.15s;
  }
  .new-chat-btn:hover { background: var(--surface); }

  .history-label {
    font-size: 11px;
    color: var(--text-dim);
    padding: 4px 12px 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .history-item {
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.15s;
  }
  .history-item:hover { background: var(--surface); color: var(--text); }
  .history-item.active { background: var(--surface); color: var(--text); }

  .sidebar-footer {
    margin-top: auto;
    padding: 12px;
    border-top: 1px solid var(--border);
  }

  .user-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .user-pill:hover { background: var(--surface); }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; color: white;
    flex-shrink: 0;
  }

  .user-name { font-size: 13px; font-weight: 500; }
  .user-plan { font-size: 11px; color: var(--text-dim); }

  /* ── Main ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* ── Top bar ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .model-selector {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
    transition: background 0.15s;
  }
  .model-selector:hover { background: var(--surface); }
  .model-badge {
    font-size: 10px;
    background: var(--accent);
    color: #000;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 700;
  }

  /* ── Chat area ── */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
    scroll-behavior: smooth;
  }

  .message-row {
    max-width: 700px;
    margin: 0 auto;
    padding: 12px 24px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.3s, transform 0.3s;
  }
  .message-row.visible { opacity: 1; transform: translateY(0); }

  .msg-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
  }

  .msg-avatar.user {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
  }

  .msg-avatar.ai {
    background: #19c37d;
    color: #000;
    font-size: 11px;
    font-weight: 800;
  }

  .msg-content {
    flex: 1;
    min-width: 0;
  }

  .msg-role {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .msg-text {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
    white-space: pre-wrap;
  }

  .msg-text strong { font-weight: 700; }
  .msg-text em { font-style: italic; color: var(--text-dim); }

  /* Streaming cursor */
  .cursor {
    display: inline-block;
    width: 2px; height: 16px;
    background: var(--text);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Highlight overlay */
  .wsda-highlight {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    border: 3px solid #ffd700;
    border-radius: 8px;
    box-shadow: 0 0 0 3px rgba(255,215,0,0.3), 0 0 24px rgba(255,215,0,0.2);
    transition: all 0.3s ease;
  }

  .wsda-callout {
    position: fixed;
    pointer-events: none;
    z-index: 10000;
    background: #ffd700;
    color: #000;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 4px;
    white-space: nowrap;
    font-family: var(--font);
  }

  /* ── Input area ── */
  .input-area {
    padding: 16px 24px 20px;
    flex-shrink: 0;
    border-top: 1px solid var(--border);
  }

  .input-box {
    max-width: 700px;
    margin: 0 auto;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 12px 16px;
    transition: border-color 0.15s;
  }
  .input-box:focus-within { border-color: var(--text-dim); }

  .input-text {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    font-family: var(--font);
    resize: none;
    min-height: 24px;
    max-height: 200px;
    line-height: 1.5;
  }
  .input-text::placeholder { color: var(--text-dim); }

  .send-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--text);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .send-btn:hover { background: #d0d0d0; }
  .send-btn svg { width: 16px; height: 16px; fill: #000; }

  .input-footer {
    max-width: 700px;
    margin: 8px auto 0;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
  }

  /* Empty state */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 40px;
  }

  .empty-logo {
    width: 48px; height: 48px;
    background: var(--text);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 20px; color: var(--bg);
  }

  .empty-title {
    font-size: 24px;
    font-weight: 600;
    text-align: center;
  }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-logo">
    <div style="width:24px;height:24px;background:#19c37d;border-radius:50%;
                display:flex;align-items:center;justify-content:center;
                font-weight:800;font-size:11px;color:#000;">G</div>
    ChatGPT
  </div>
  <button class="new-chat-btn" id="new-chat-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    New chat
  </button>
  <div class="history-label">Today</div>
  <div id="history-list"></div>
  <div class="sidebar-footer">
    <div class="user-pill">
      <div class="avatar" id="user-avatar">W</div>
      <div>
        <div class="user-name" id="user-name">Walter Shields</div>
        <div class="user-plan">Free plan</div>
      </div>
    </div>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <div class="model-selector">
      ChatGPT <span style="color:var(--text-dim);font-weight:400">3.5</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <div style="font-size:12px;color:var(--text-dim)">Share</div>
    </div>
  </div>

  <div class="chat-area" id="chat-area">
    <div class="empty-state" id="empty-state">
      <div class="empty-logo">G</div>
      <div class="empty-title">How can I help you today?</div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-box" id="input-box">
      <textarea class="input-text" id="input-text"
        placeholder="Message ChatGPT" rows="1"></textarea>
      <button class="send-btn" id="send-btn">
        <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22 11 13 2 9l20-7z"/></svg>
      </button>
    </div>
    <div class="input-footer">
      ChatGPT can make mistakes. Consider checking important information.
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────
let conversationId = null;
let messageQueue = [];
let isStreaming = false;
let highlightEl = null;
let calloutEl = null;

// ── WSDA Control API ───────────────────────────────────────────────
// Called by the Playwright adapter to control the demo

window.wsda_chat = {

  // Set user display name
  setUser(name, initials) {
    document.getElementById('user-name').textContent = name;
    document.getElementById('user-avatar').textContent = initials || name[0];
  },

  // Start a new conversation (clears chat)
  newConversation(title) {
    conversationId = Date.now();
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('chat-area').innerHTML = '';
    if (title) {
      const item = document.createElement('div');
      item.className = 'history-item active';
      item.textContent = title;
      document.getElementById('history-list').prepend(item);
    }
  },

  // Type a user message (character by character)
  async typeUserMessage(text, wpm = 60) {
    const textarea = document.getElementById('input-text');
    textarea.value = '';
    textarea.focus();
    const delay = 60000 / (wpm * 5);
    for (const ch of text) {
      textarea.value += ch;
      await sleep(delay + (Math.random() * delay * 0.3));
    }
  },

  // Show a user message instantly (no typing)
  async showMessageInstant(text, regionId) {
    if (document.getElementById('empty-state')) {
      document.getElementById('empty-state').remove();
    }
    const row = addMessage('user', text);
    if (regionId) row.setAttribute('data-region', regionId);
    await sleep(200);
  },

  // Show a full AI response instantly (no streaming)
  async showResponseInstant(text, regionId) {
    const row = addMessage('ai', text);
    if (regionId) row.setAttribute('data-region', regionId);
    scrollToBottom();
    await sleep(200);
  },

  // Submit the current input as a user message
  async submitMessage(textOverride) {
    const textarea = document.getElementById('input-text');
    const text = textOverride || textarea.value.trim();
    if (!text) return;
    textarea.value = '';

    if (document.getElementById('empty-state')) {
      document.getElementById('empty-state').remove();
    }

    addMessage('user', text);
    await sleep(300);
  },

  // Stream an AI response (simulates token-by-token streaming)
  async streamResponse(text, wpm = 180) {
    const row = addMessage('ai', '', true);
    const textEl = row.querySelector('.msg-text');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    textEl.appendChild(cursor);

    const words = text.split(' ');
    const delay = 60000 / wpm;
    let built = '';

    for (const word of words) {
      built += (built ? ' ' : '') + word;
      textEl.textContent = built;
      textEl.appendChild(cursor);
      scrollToBottom();
      await sleep(delay + (Math.random() * delay * 0.4));
    }

    cursor.remove();
    textEl.textContent = built;
    scrollToBottom();
  },

  // Highlight a named region with a gold border
  highlight(regionId, calloutText) {
    const el = document.getElementById(regionId) ||
               document.querySelector(`[data-region="${regionId}"]`);
    if (!el) { console.warn('region not found:', regionId); return; }

    clearHighlight();
    const rect = el.getBoundingClientRect();

    highlightEl = document.createElement('div');
    highlightEl.className = 'wsda-highlight';
    Object.assign(highlightEl.style, {
      top:    (rect.top    - 4) + 'px',
      left:   (rect.left   - 4) + 'px',
      width:  (rect.width  + 8) + 'px',
      height: (rect.height + 8) + 'px',
    });
    document.body.appendChild(highlightEl);

    if (calloutText) {
      calloutEl = document.createElement('div');
      calloutEl.className = 'wsda-callout';
      calloutEl.textContent = calloutText;
      Object.assign(calloutEl.style, {
        top:  (rect.top - 30) + 'px',
        left: rect.left + 'px',
      });
      document.body.appendChild(calloutEl);
    }
  },

  clearHighlight,

  // Set the textarea content directly (for showing a pre-written prompt)
  setInputText(text) {
    const ta = document.getElementById('input-text');
    ta.value = text;
    ta.focus();
  },

  // Scroll chat to bottom
  scrollToBottom,
};

// ── Helpers ────────────────────────────────────────────────────────
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function scrollToBottom() {
  const ca = document.getElementById('chat-area');
  ca.scrollTop = ca.scrollHeight;
}

function clearHighlight() {
  if (highlightEl) { highlightEl.remove(); highlightEl = null; }
  if (calloutEl)   { calloutEl.remove();   calloutEl   = null; }
}

function addMessage(role, text, streaming = false) {
  const row = document.createElement('div');
  row.className = 'message-row';
  row.innerHTML = `
    <div class="msg-avatar ${role}">${role === 'user' ? 'W' : 'AI'}</div>
    <div class="msg-content">
      <div class="msg-role">${role === 'user' ? 'You' : 'ChatGPT'}</div>
      <div class="msg-text">${text}</div>
    </div>`;
  document.getElementById('chat-area').appendChild(row);
  requestAnimationFrame(() => row.classList.add('visible'));
  scrollToBottom();
  return row;
}

// Signal ready to Playwright
window.wsda_chat_ready = true;

// Auto-resize textarea
document.getElementById('input-text').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 200) + 'px';
});
</script>
</body>
</html>

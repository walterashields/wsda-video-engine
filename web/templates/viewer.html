<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WSDA SQL Viewer</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #7d8590;
    --accent: #2f81f7;
    --accent-glow: rgba(47,129,247,0.15);
    --green: #3fb950;
    --green-bg: rgba(63,185,80,0.12);
    --red: #f85149;
    --red-bg: rgba(248,81,73,0.12);
    --yellow: #d29922;
    --yellow-bg: rgba(210,153,34,0.12);
    --font-mono: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Title Card Overlay ── */
  #title-card {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 40px;
    text-align: center;
  }
  #title-card.active { display: flex; }
  #title-card .title-card-badge {
    background: var(--red-bg);
    color: var(--red);
    border: 1px solid var(--red);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 24px;
  }
  #title-card .title-card-headline {
    font-size: 42px;
    font-weight: 800;
    line-height: 1.15;
    max-width: 800px;
    margin-bottom: 20px;
    background: linear-gradient(90deg, #fff 0%, #7d8590 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #title-card .title-card-sub {
    font-size: 20px;
    color: var(--text-dim);
    max-width: 600px;
    line-height: 1.5;
  }
  #title-card .title-card-stakes {
    margin-top: 32px;
    font-size: 18px;
    color: var(--red);
    font-weight: 600;
    padding: 12px 24px;
    border: 1px solid var(--red);
    border-radius: 8px;
    background: var(--red-bg);
  }

  /* ── Layout ── */
  .app { display: flex; flex: 1; overflow: hidden; }
  .sidebar {
    width: 260px;
    min-width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: width 0.3s ease, min-width 0.3s ease;
  }
  .sidebar.collapsed { width: 0; min-width: 0; overflow: hidden; border: none; }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Header ── */
  .header {
    height: 48px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    font-size: 13px;
  }
  .header-brand { font-weight: 700; color: var(--accent); }
  .header-db { color: var(--text-dim); }
  .header-db strong { color: var(--text); }
  .header-toggle {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .header-toggle:hover { color: var(--text); border-color: var(--accent); }

  /* ── Schema Panel ── */
  .schema-header {
    padding: 12px 16px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .schema-list { flex: 1; overflow-y: auto; padding: 8px; }
  .schema-table {
    margin-bottom: 8px;
    border-radius: 6px;
    overflow: hidden;
  }
  .schema-table-name {
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    background: rgba(255,255,255,0.03);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .schema-table-name:hover { background: rgba(255,255,255,0.06); }
  .schema-table-name .arrow { font-size: 10px; transition: transform 0.2s; }
  .schema-table-name.expanded .arrow { transform: rotate(90deg); }
  .schema-columns {
    display: none;
    padding: 4px 12px 8px;
  }
  .schema-columns.visible { display: block; }
  .schema-col {
    font-size: 12px;
    padding: 3px 0;
    color: var(--text-dim);
    font-family: var(--font-mono);
  }
  .schema-col .col-type { color: var(--text-dim); opacity: 0.6; margin-left: 4px; }

  /* ── SQL Editor ── */
  .sql-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sql-toolbar {
    height: 40px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 8px;
  }
  .sql-toolbar button {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .sql-toolbar button:hover { opacity: 0.9; }
  .sql-toolbar .tab {
    padding: 6px 12px;
    font-size: 12px;
    color: var(--text-dim);
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  .sql-toolbar .tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  .sql-editor-wrap {
    flex: 1;
    position: relative;
    overflow: auto;
  }
  .sql-editor {
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    border: none;
    padding: 16px 20px;
    font-family: var(--font-mono);
    font-size: 16px;
    line-height: 1.7;
    color: var(--text);
    resize: none;
    outline: none;
    white-space: pre;
    tab-size: 2;
  }

  /* ── Query Color Coding ── */
  .sql-editor .query-correct { background: var(--green-bg); }
  .sql-editor .query-buggy { background: var(--red-bg); }
  .sql-editor .query-label {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    margin-right: 8px;
    vertical-align: middle;
  }
  .sql-editor .query-label.correct { background: var(--green); color: #000; }
  .sql-editor .query-label.buggy { background: var(--red); color: #fff; }

  /* ── Results ── */
  .results-area {
    height: 45%;
    min-height: 200px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
  }
  .results-header {
    padding: 10px 16px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .results-header .row-count {
    font-size: 12px;
    color: var(--text);
    font-weight: 600;
  }
  .results-table-wrap {
    flex: 1;
    overflow: auto;
  }
  .results-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
  }
  .results-table th {
    text-align: left;
    padding: 10px 16px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    white-space: nowrap;
  }
  .results-table td {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 15px;
    white-space: nowrap;
  }
  .results-table tr:hover td { background: rgba(255,255,255,0.03); }

  /* ── Row Highlighting ── */
  .results-table tr.highlighted td {
    background: var(--accent-glow) !important;
    border-left: 3px solid var(--accent);
    animation: pulse-row 2s ease-in-out infinite;
  }
  @keyframes pulse-row {
    0%, 100% { background: var(--accent-glow); }
    50% { background: rgba(47,129,247,0.25); }
  }
  .results-table tr.highlighted-red td {
    background: var(--red-bg) !important;
    border-left: 3px solid var(--red);
  }
  .results-table tr.highlighted-green td {
    background: var(--green-bg) !important;
    border-left: 3px solid var(--green);
  }

  /* ── Cell Callout ── */
  .cell-callout {
    position: relative;
    display: inline-block;
  }
  .cell-callout::after {
    content: attr(data-callout);
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--yellow);
    color: #000;
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 10;
  }
  .cell-callout.visible::after { opacity: 1; }
  .cell-callout.important {
    background: var(--yellow-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 700;
  }

  /* ── Empty State ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-dim);
    font-size: 14px;
    gap: 12px;
  }
  .empty-state .icon {
    width: 48px;
    height: 48px;
    border: 2px solid var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  /* ── Status Bar ── */
  .status-bar {
    height: 28px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    font-size: 12px;
    color: var(--text-dim);
    gap: 16px;
  }
  .status-bar .status-ok { color: var(--green); }
  .status-bar .status-warn { color: var(--yellow); }
  .status-bar .status-err { color: var(--red); }

  /* ── Cursor Ring (for recording) ── */
  #cursor-ring {
    position: fixed;
    width: 32px;
    height: 32px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    display: none;
    transition: all 0.15s ease;
  }
  #cursor-ring.active { display: block; }
</style>
</head>
<body>

<!-- Title Card Overlay -->
<div id="title-card">
  <div class="title-card-badge" id="title-badge">SQL Debugging</div>
  <div class="title-card-headline" id="title-headline">Loading...</div>
  <div class="title-card-sub" id="title-sub">Loading...</div>
  <div class="title-card-stakes" id="title-stakes" style="display:none"></div>
</div>

<!-- Cursor Ring -->
<div id="cursor-ring"></div>

<div class="app" id="app">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="schema-header">
      <span>Schema</span>
      <span id="schema-count" style="font-size:11px;color:var(--text-dim)"></span>
    </div>
    <div class="schema-list" id="schema-list"></div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="header">
      <span class="header-brand">WSDA</span>
      <span style="color:var(--border)">|</span>
      <span class="header-db" id="header-db">No database loaded</span>
      <button class="header-toggle" id="toggle-schema" onclick="toggleSchema()">◀ Schema</button>
    </div>

    <div class="sql-area">
      <div class="sql-toolbar">
        <button onclick="runQuery()">▷ Run</button>
        <div style="flex:1"></div>
        <div class="tab active" id="tab-sql">SQL</div>
        <div class="tab" id="tab-results">Results</div>
      </div>
      <div class="sql-editor-wrap">
        <textarea class="sql-editor" id="sql-editor" placeholder="-- Write your SQL here..." spellcheck="false"></textarea>
      </div>
    </div>

    <div class="results-area">
      <div class="results-header">
        <span>Results</span>
        <span class="row-count" id="row-count"></span>
      </div>
      <div class="results-table-wrap" id="results-wrap">
        <div class="empty-state">
          <div class="icon">▷</div>
          <span>Run a query to see results</span>
        </div>
      </div>
    </div>

    <div class="status-bar">
      <span id="status-text">Ready</span>
      <span style="margin-left:auto" id="status-detail"></span>
    </div>
  </div>
</div>

<script>
// ── State ──
let db = null;
let currentFile = null;
let sections = [];
let schemaVisible = true;

// ── Title Card ──
function showTitleCard(badge, headline, sub, stakes) {
  document.getElementById('title-badge').textContent = badge || 'SQL Lesson';
  document.getElementById('title-headline').textContent = headline;
  document.getElementById('title-sub').textContent = sub || '';
  const stakesEl = document.getElementById('title-stakes');
  if (stakes) {
    stakesEl.textContent = stakes;
    stakesEl.style.display = 'block';
  } else {
    stakesEl.style.display = 'none';
  }
  document.getElementById('title-card').classList.add('active');
}
function hideTitleCard() {
  document.getElementById('title-card').classList.remove('active');
}

// ── Schema Toggle ──
function toggleSchema() {
  schemaVisible = !schemaVisible;
  document.getElementById('sidebar').classList.toggle('collapsed', !schemaVisible);
  document.getElementById('toggle-schema').textContent = schemaVisible ? '◀ Schema' : '▶ Schema';
}
function collapseSchema() {
  schemaVisible = false;
  document.getElementById('sidebar').classList.add('collapsed');
  document.getElementById('toggle-schema').textContent = '▶ Schema';
}
function expandSchema() {
  schemaVisible = true;
  document.getElementById('sidebar').classList.remove('collapsed');
  document.getElementById('toggle-schema').textContent = '◀ Schema';
}

// ── Row Highlighting ──
function highlightRow(tableSelector, rowIndex, color) {
  const table = document.querySelector(tableSelector || '.results-table');
  if (!table) return;
  const rows = table.querySelectorAll('tbody tr');
  rows.forEach(r => r.classList.remove('highlighted', 'highlighted-red', 'highlighted-green'));
  if (rows[rowIndex]) {
    rows[rowIndex].classList.add(color === 'red' ? 'highlighted-red' : color === 'green' ? 'highlighted-green' : 'highlighted');
  }
}
function clearHighlights(tableSelector) {
  const table = document.querySelector(tableSelector || '.results-table');
  if (!table) return;
  table.querySelectorAll('tr').forEach(r => r.classList.remove('highlighted', 'highlighted-red', 'highlighted-green'));
}

// ── Cell Callout ──
function annotateCell(tableSelector, rowIndex, colIndex, text) {
  const table = document.querySelector(tableSelector || '.results-table');
  if (!table) return;
  const rows = table.querySelectorAll('tbody tr');
  if (!rows[rowIndex]) return;
  const cells = rows[rowIndex].querySelectorAll('td');
  if (!cells[colIndex]) return;
  cells[colIndex].classList.add('cell-callout', 'important');
  cells[colIndex].setAttribute('data-callout', text);
  setTimeout(() => cells[colIndex].classList.add('visible'), 100);
}
function clearAnnotations(tableSelector) {
  const table = document.querySelector(tableSelector || '.results-table');
  if (!table) return;
  table.querySelectorAll('.cell-callout').forEach(c => {
    c.classList.remove('cell-callout', 'important', 'visible');
    c.removeAttribute('data-callout');
  });
}

// ── Query Color Coding ──
function setQueryColor(startLine, endLine, type) {
  const editor = document.getElementById('sql-editor');
  // This is a visual marker — in practice the adapter injects CSS classes
  // into the editor content or wraps query blocks
  console.log(`Query lines ${startLine}-${endLine} marked as ${type}`);
}

// ── Cursor Ring ──
function moveCursorRing(x, y) {
  const ring = document.getElementById('cursor-ring');
  ring.style.left = (x - 16) + 'px';
  ring.style.top = (y - 16) + 'px';
  ring.classList.add('active');
}
function hideCursorRing() {
  document.getElementById('cursor-ring').classList.remove('active');
}

// ── Database Loading ──
function loadDatabase(name) {
  document.getElementById('header-db').innerHTML = `Database: <strong>${name}</strong>`;
  setStatus('Database loaded: ' + name, 'ok');
}

// ── Schema Rendering ──
function renderSchema(tables) {
  const list = document.getElementById('schema-list');
  list.innerHTML = '';
  document.getElementById('schema-count').textContent = tables.length + ' tables';
  tables.forEach(t => {
    const div = document.createElement('div');
    div.className = 'schema-table';
    div.innerHTML = `
      <div class="schema-table-name" onclick="toggleTable(this)">
        <span class="arrow">▶</span>
        <span>${t.name}</span>
      </div>
      <div class="schema-columns">
        ${t.columns.map(c => `<div class="schema-col">${c.name}<span class="col-type">${c.type}</span></div>`).join('')}
      </div>
    `;
    list.appendChild(div);
  });
}
function toggleTable(el) {
  el.classList.toggle('expanded');
  el.nextElementSibling.classList.toggle('visible');
}
function activateTable(tableName) {
  // Expand a specific table by name
  document.querySelectorAll('.schema-table-name').forEach(el => {
    if (el.textContent.includes(tableName)) {
      el.classList.add('expanded');
      el.nextElementSibling.classList.add('visible');
    }
  });
}

// ── SQL Editor ──
function setSQL(content) {
  document.getElementById('sql-editor').value = content;
}
function getSQL() {
  return document.getElementById('sql-editor').value;
}
function highlightSection(sectionName) {
  // Scroll to and visually emphasize a named section
  console.log('Highlight section:', sectionName);
}

// ── Query Execution ──
function runQuery() {
  setStatus('Running query...', 'warn');
  // Actual execution is handled by the adapter injecting results
}
function showResults(columns, rows, queryName) {
  const wrap = document.getElementById('results-wrap');
  if (!rows || rows.length === 0) {
    wrap.innerHTML = '<div class="empty-state"><div class="icon">∅</div><span>No results</span></div>';
    document.getElementById('row-count').textContent = '0 rows';
    return;
  }
  let html = '<table class="results-table"><thead><tr>';
  columns.forEach(c => html += `<th>${c}</th>`);
  html += '</tr></thead><tbody>';
  rows.forEach(row => {
    html += '<tr>';
    row.forEach(cell => html += `<td>${cell !== null ? cell : 'NULL'}</td>`);
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
  document.getElementById('row-count').textContent = rows.length + ' rows';
  setStatus('Query complete: ' + (queryName || ''), 'ok');
}
function zoomResult() {
  // Expand results area for emphasis
  document.querySelector('.results-area').style.height = '65%';
  document.querySelector('.sql-area').style.flex = '0 0 35%';
}
function resetZoom() {
  document.querySelector('.results-area').style.height = '';
  document.querySelector('.sql-area').style.flex = '';
}

// ── Status ──
function setStatus(text, type) {
  const el = document.getElementById('status-text');
  el.textContent = text;
  el.className = type === 'ok' ? 'status-ok' : type === 'warn' ? 'status-warn' : type === 'err' ? 'status-err' : '';
}

// ── Fade Out ──
function fadeOut() {
  document.body.style.transition = 'opacity 1.5s ease';
  document.body.style.opacity = '0';
}

// ── Init ──
window.addEventListener('DOMContentLoaded', () => {
  console.log('WSDA SQL Viewer ready');
});
</script>
</body>
</html>
